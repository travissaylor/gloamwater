function damage(n){const before=S.hull;S.hull=Math.max(0,S.hull-n);sfx.hit();shake();renderHUD();return Math.round(before-S.hull);}
function loadFrac(){return holdUsed()/capacity();}
async function sunk(cause){
  store.del(KEY_SAVE);S.over=true;
  sfx.lose();FX.rain(140);
  await info({keepFx:true,art:'sunk',tone:'danger',kicker:'Night '+S.day,title:'The Little Lantern goes down',body:`${cause} The canal closes over your skiff, your cargo and every crown in your purse. You drag yourself onto a pontoon at dawn, alive and very poor.`,ok:'See the reckoning'});
  await endGame('sunk');
}

async function encounter(kind){
  try{return await fightIt(kind);}finally{if(S&&S.trip){delete S.trip.boats;delete S.trip.boats0;}}
}
async function fightIt(kind){
  const cfg={
    patrol:{title:'Tidewarden cutter!',kicker:'Searchlights on the water',intro:n=>`${n===1?'A Tidewarden cutter swings':'A squadron of '+n+' Tidewarden cutters swing'} out of the dark, lamps blazing. "Heave to for inspection!" Contraband is contraband, and you're carrying it.`},
    gulls:{title:'The Gull Gang!',kicker:'Ambush in the narrows',intro:n=>`${n} skiffs with gull-feather pennants slide out from under a bridge. "Toll's due, friend. Pay up, or swim."`},
    collectors:{title:"Marrow's collectors",kicker:'Your debt has come to visit',intro:n=>`Two black launches with heron lamps block the canal. "Marrow Quill wonders why his money is out here and not in his office."`}
  }[kind];
  // the enemy count is saved with the voyage, so reloading mid-encounter resumes the same fight
  const T=S.trip&&typeof S.trip==='object'?S.trip:null;
  let boats=T&&isNum(T.boats)&&T.boats>0?Math.min(5,Math.round(T.boats)):kind==='patrol'?clamp(rint(1,3)+(S.day>18?1:0),1,4):kind==='gulls'?rint(2,4):2;
  const start=T&&isNum(T.boats0)&&T.boats0>=boats?Math.min(5,Math.round(T.boats0)):boats;
  if(!(T&&isNum(T.boats)&&T.boats>0))S.stats.fights++;
  if(T){T.boats=boats;T.boats0=start;save();}
  let result=null;sfx.alarm();
  const art='enc_'+kind;
  while(true){
    ART[art]=ART[kind](boats);
    const fleeP=clamp(.44+.15*S.motor-.06*(boats-1)-.14*loadFrac(),.12,.9);
    const fightP=clamp(ARMS[S.arms].p-.03*(boats-1),.08,.85);
    const bribe=Math.round(250*boats+S.cash*.12);
    const toll=Math.max(200,Math.round(S.cash*.3));
    const collect=Math.max(500,Math.round(Math.min(S.cash,S.debt)*.35));
    const choices=[
      {key:'run',label:'Run for it',sub:`${pct(fleeP)} chance to slip away${loadFrac()>.6?' (a heavy hold slows you)':''}`,cls:'risk'},
      {key:'fight',label:`Fight · ${ARMS[S.arms].name}`,sub:`${pct(fightP)} per volley to disable a boat. They shoot back.`,cls:'risk'}
    ];
    if(kind==='patrol'){choices.push({key:'bribe',label:`Bribe the sergeant · ${fmt(bribe)}`,sub:'Guaranteed. Costs more with more boats.',disabled:S.cash<bribe});
      choices.push({key:'yield',label:'Heave to and be searched',sub:'They seize half of every cargo and any sealed parcels.'});}
    else if(kind==='gulls')choices.push({key:'pay',label:S.cash>=toll?`Pay the toll · ${fmt(toll)}`:'Pay the toll · empty purse',sub:S.cash>=toll?'30% of your purse. They keep their word, mostly.':shortSub()});
    else choices.push({key:'pay',label:S.cash>=collect?`Hand over ${fmt(collect)}`:`Hand over ${fmt(S.cash)} and cargo`,sub:S.cash>=collect?'Counts toward your debt. Marrow is nothing if not fair.':'Your purse is short, so they take cargo too. All of it counts toward your debt.'});
    const extra=`<div class="enc-stats"><div>Your hull<b>${Math.round(S.hull)}%</b><div class="bar"><i style="width:${S.hull}%;background:${S.hull>60?'var(--up)':S.hull>30?'var(--amber)':'var(--down)'}"></i></div></div><div>Enemy boats<b>${boats}</b></div><div>Cargo aboard<b>${cargoCount()}</b></div></div>`;
    if(T)T.boats=boats;save(); // each round's damage is committed before the next choice
    const c=await choose({art,tone:'danger',kicker:cfg.kicker,title:cfg.title,body:result?'':cfg.intro(boats),result,extra,choices});
    if(c==='run'){
      if(rnd()<fleeP){sfx.escape();S.stats.fled++;await info({art:'news',tone:'luck',kicker:'Escaped',title:'Lost them in the fog',body:'You kill the lantern, cut under a footbridge and drift through a drowned arcade. The searchlights sweep past and fade.'});log(`Outran ${kind==='patrol'?'a Tidewarden patrol':kind==='gulls'?'the Gull Gang':"Marrow's collectors"}.`,'good');return;}
      const dmg=damage(rint(5,10)+boats*rint(2,4));
      if(S.hull<=0)return sunk('They ran you down and holed you below the waterline.');
      result={k:'bad',t:`They cut you off and rake your hull. <b>−${dmg}% hull.</b>`};
    }else if(c==='fight'){
      sfx.shot();
      let msg='';
      if(rnd()<fightP){boats--;if(T){T.boats=Math.max(1,boats);save();}msg=`Direct hit! One boat drifts away, smoking. `;FX.burst(innerWidth/2,innerHeight*.3,'#ff8f3c',30);}
      else msg='Your shot goes wide. ';
      if(boats<=0){
        S.stats.won++;sfx.win();
        let loot=0,goods='';
        if(kind==='gulls'){const free=capacity()-holdUsed();const g=pick(GOODS.slice(0,6));const n=Math.min(free,rint(3,10)*start);if(n>0){const c2=S.cargo[g.id];c2.cost=(c2.cost*c2.q)/(c2.q+n);c2.q+=n;goods=`, plus ${n} ${g.name} from their hold`;}loot=rint(300,900)*start;}
        else loot=rint(500,1400)*start;
        S.cash+=loot;
        log(`Fought off ${kind==='patrol'?'the Tidewardens':kind==='gulls'?'the Gull Gang':"Marrow's collectors"} and took ${fmt(loot)}${goods}.`,'gold');
        await info({keepFx:true,art:'victory',tone:'luck',kicker:'Victory',title:'The canal is yours',body:`${msg}The last of them turns tail. You fish their strongbox out of the water: <b>${fmt(loot)}</b>${goods}.`});
        renderAll();return;
      }
      if(rnd()<.7){const dmg=damage(rint(4,8)+boats*rint(2,4));if(S.hull<=0)return sunk('Their return fire tore your skiff apart.');msg+=`They return fire. <b>−${dmg}% hull.</b>`;}
      else msg+='Their return fire splashes harmlessly.';
      result={k:boats<start?'good':'bad',t:msg};
    }else if(c==='bribe'){
      const b=Math.round(250*boats+S.cash*.12);S.cash-=b;S.stats.bribes++;sfx.bank();
      log(`Bribed a Tidewarden sergeant ${fmt(b)}.`,'bad');
      await info({art:'news',kicker:'Bribe accepted',title:'Papers in order',body:`The sergeant pockets ${fmt(b)}, stamps nothing, and waves you on. "Mind the fog, citizen."`});return;
    }else if(c==='yield'){
      let lost=[];GOODS.forEach(g=>{const cg=S.cargo[g.id];const n=Math.ceil(cg.q/2);if(n>0){cg.q-=n;if(!cg.q)cg.cost=0;lost.push(n+' '+g.name);}});
      const par=S.contracts.length;S.contracts=[];
      log(`Searched by Tidewardens. Seized: ${lost.join(', ')||'nothing'}${par?' and your sealed parcels':''}.`,'bad');
      await info({art:'news',tone:'danger',kicker:'Inspection',title:'Confiscated',body:lost.length?`They haul off ${lost.join(', ')}${par?', and the sealed parcels':''}. At least the skiff's still yours.`:'They find nothing worth taking and leave, disappointed.'});return;
    }else if(c==='pay'){
      const due=kind==='gulls'?toll:collect,amt=Math.min(due,S.cash);S.cash-=amt;
      // a light purse is no way out: the shortfall comes out of the hold, or the hull
      let extraTxt='';
      if(amt<due){const sh=payShort(kind==='gulls'?1/3:1/2);extraTxt=sh.txt;if(kind==='collectors')S.debt=Math.max(0,S.debt-sh.value);if(S.hull<=0)return sunk('They smashed your skiff to kindling.');}
      if(kind==='collectors'){S.debt=Math.max(0,S.debt-amt);log(`Marrow's collectors took ${fmt(amt)}${extraTxt?' and '+extraTxt:''} off your debt.`,'bad');}
      else log(`Paid the Gull Gang ${amt?fmt(amt):''}${amt&&extraTxt?' and ':''}${extraTxt}.`,'bad');
      sfx.bank();await info({art:'news',kicker:'Paid',title:kind==='gulls'?'Toll paid':'Payment collected',body:(kind==='gulls'?(amt?`They count your ${fmt(amt)} twice.`:'You turn out your empty pockets.'):`${fmt(amt)} goes into a ledger with your name on it.`)+(extraTxt?` The rest is taken in kind: <b>${extraTxt}</b>.`:'')+(kind==='gulls'?' They melt back into the dark.':' "Marrow says the rest is due soon."')});return;
    }
  }
}

// what an encounter takes when the purse can't cover it: a share of every cargo, or hull if the hold is empty
function shortSub(){return cargoCount()?'Your purse is too light. They take a third of your cargo instead.':'Nothing aboard worth taking. They will smash up the skiff (−12% hull).';}
function payShort(frac){
  const lost=[];let value=0;
  GOODS.forEach(g=>{const cg=S.cargo[g.id];const n=Math.ceil(cg.q*frac);if(n>0){value+=Math.round(n*g.base*.5);cg.q-=n;if(!cg.q)cg.cost=0;lost.push(n+' '+g.name);}});
  if(lost.length)return{txt:lost.join(', '),value};
  const d=damage(12);return{txt:`${d}% of your hull`,value:0};
}
async function evSquall(){
  const canShelter=S.day<NIGHTS-1;
  const c=await choose({art:'squall',tone:'danger',kicker:'Weather',title:'A squall comes off the sea',body:'Black rain hammers the canal and the water starts to heave. Somewhere ahead, bridges are groaning.',
    choices:[{key:'push',label:'Push through',sub:'Arrive on time, but the hull will take a beating.',cls:'risk'},{key:'shelter',label:'Shelter under the viaduct',sub:canShelter?'Safe, but you lose a whole night.':'No time left to wait.',disabled:!canShelter}]});
  if(c==='push'){const dmg=damage(rint(6,16));if(S.hull<=0)return sunk('The squall smashed you against a bridge pier.');log(`Pushed through a squall. Hull −${dmg}%.`,'bad');FX.rain(80);}
  else{advanceDay();log('Sheltered from a squall and lost a night.','bad');toast('You lost a night waiting out the storm','bad','bell');}
}
async function evCrate(){
  const g=pick(GOODS.slice(0,5));const n=rint(4,12);
  const c=await choose({art:'crate',tone:'luck',kicker:'Flotsam',title:'A crate bobs past',body:`A sealed crate stencilled with <b>${g.name}</b> marks drifts alongside. Nobody seems to be looking for it. Yet.`,
    choices:[{key:'take',label:'Haul it aboard',sub:'Free cargo, if it is what it says.'},{key:'leave',label:'Leave it',sub:'Not worth the trouble.'}]});
  if(c!=='take')return;
  if(rnd()<.8){const free=capacity()-holdUsed();const k=Math.min(free,n);
    if(k<=0){await info({art:'crate',title:'No room',body:`It's ${n} ${g.name}, and your hold is full. You watch it drift away.`});return;}
    const cg=S.cargo[g.id];cg.cost=(cg.cost*cg.q)/(cg.q+k);cg.q+=k;sfx.sell();log(`Fished ${k} ${g.name} out of the canal.`,'gold');
    await info({art:'crate',tone:'luck',title:'Free cargo',body:`It's ${n} ${g.name}, dry and sealed.${k<n?` You have room for ${k}.`:''} Free money.`});}
  else{const dmg=damage(rint(5,10));if(S.hull<=0)return sunk('The crate was rigged to blow.');log(`A booby-trapped crate exploded. Hull −${dmg}%.`,'bad');
    await info({art:'crate',tone:'danger',title:'It was a trap',body:`The lid springs and something inside goes <i>bang</i>. The Gull Gang leave these out for fools. <b>−${dmg}% hull.</b>`});}
}
async function evGull(){
  const amt=Math.min(6000,Math.round(S.cash*(.06+rnd()*.08)));S.cash-=amt;log(`A gull stole ${fmt(amt)} from your coin bag.`,'bad');sfx.error();
  await info({art:'gull',tone:'danger',kicker:'Thief!',title:'A gull takes your purse',body:`A huge grey gull dives, snatches a coin bag off the thwart, and is gone over the rooftops with <b>${fmt(amt)}</b>. Gloamwater's gulls are trained, and not by honest people.`,extra:'<div class="result info">Tip: the Vault keeps your money safe from thieves.</div>'});
}
async function evRacks(){
  const cost=2200+S.day*120;
  const c=await choose({art:'racks',tone:'gold',kicker:'An offer',title:'Old Fenna is retiring',body:`A grey-haired smuggler hails you from her houseboat. "My racking's too good for scrap. Fifteen more spaces in your hold for <b>${fmt(cost)}</b>, fitted tonight."`,
    choices:[{key:'buy',label:`Buy the racks · ${fmt(cost)}`,sub:'+15 hold, permanently.',disabled:S.cash<cost,cls:'primary'},{key:'no',label:'No thanks',sub:'Maybe another time.'}]});
  if(c==='buy'){S.cash-=cost;S.racks=true;sfx.upgrade();log(`Bought Fenna's hold racks. Capacity now ${capacity()}.`,'gold');toast(`Hold +15 (now ${capacity()})`,'gold','crate');}
}
async function evFortune(){
  const small=Math.max(50,Math.round(S.cash*.05/10)*10),big=Math.max(100,Math.round(S.cash*.2/10)*10);
  const c=await choose({art:'eel',tone:'gold',kicker:'A game of chance',title:'Grandmother Wick and her eel',body:'An old woman keeps a glowing eel in a jar. "Feed him coin, dearie. If he turns gold, he pays you back two and a half times. If he turns black... well."',
    choices:[{key:'small',label:`Small offering · ${fmt(small)}`,sub:'40% chance to win 2.5×',disabled:S.cash<small},{key:'big',label:`Big offering · ${fmt(big)}`,sub:'Same odds, more at stake.',disabled:S.cash<big,cls:'risk'},{key:'no',label:'Walk on',sub:'Superstition is for landlubbers.'}]});
  if(c==='no')return;
  const stake=c==='small'?small:big;S.cash-=stake;
  if(rnd()<.4){const win=Math.round(stake*2.5);S.cash+=win;sfx.win();FX.burst(innerWidth/2,innerHeight*.35,'#ffd14d',40);log(`The eel turned gold: won ${fmt(win)}.`,'gold');
    await info({keepFx:true,art:'eelwin',tone:'luck',title:'The eel turns gold!',body:`The jar blazes like a lantern. Grandmother Wick cackles and counts out <b>${fmt(win)}</b>.`});}
  else{sfx.lose();log(`The eel turned black. Lost ${fmt(stake)}.`,'bad');
    await info({art:'eellose',tone:'danger',title:'The eel turns black',body:`The jar goes dark as ink. "Not your night, dearie." Your ${fmt(stake)} is gone.`});}
}
async function evLeak(){
  const held=GOODS.filter(g=>S.cargo[g.id].q>0);if(!held.length)return;
  const g=pick(held),cg=S.cargo[g.id];const n=Math.max(1,Math.round(cg.q*(.15+rnd()*.25)));cg.q-=n;if(!cg.q)cg.cost=0;
  sfx.splash();log(`Bilge water ruined ${n} ${g.name}.`,'bad');
  await info({art:'leak',tone:'danger',kicker:'Leak',title:'Water in the hold',body:`${S.hull<60?'Your battered hull':'A loose plank'} lets the canal in overnight. <b>${n} ${g.name}</b> ${n===1?'is':'are'} ruined.`,extra:S.hull<60?'<div class="result info">Damaged hulls leak more often. Odile at Copperhook Docks does proper repairs.</div>':''});
}
async function evTip(){
  if(S.day>=NIGHTS)return evStrongbox();
  const e=leakPending();if(!e)return evStrongbox();
  sfx.event();
  log(`Pell the lamplighter heard a rumour: tomorrow at ${DI[e.d].name}, ${GI[e.g].name} ${e.type==='spike'?'will surge':'will crash'}.`,'info');
  await info({art:'tip',tone:'gold',kicker:'A friendly word',title:'Pell the lamplighter',body:`Pell lowers his pole and leans down to your skiff. "Heard something on my rounds. Tomorrow: <i>${esc(e.text)}</i>"`,extra:rumorOdds(e,'Pell')});
}
async function evCourier(){
  const dests=DISTRICTS.filter(d=>d.id!==S.loc);const to=pick(dests);const days=rint(2,5);const due=Math.min(NIGHTS,S.day+days);
  const reward=Math.round((700+rnd()*1600)*(1+S.day/9)/10)*10;const size=5;
  const free=capacity()-holdUsed();
  const c=await choose({art:'courier',tone:'gold',kicker:'A job',title:'A soaked courier flags you down',body:`"Sealed parcel for <b>${to.name}</b>. Don't open it, don't drop it, and don't let the Tidewardens see it. Pays <b>${fmt(reward)}</b> on delivery by night ${due}."`,
    choices:[{key:'yes',label:`Take the job · ${size} hold`,sub:free<size?'Not enough free hold.':`Deliver to ${to.name} by night ${due}.`,disabled:free<size,cls:'primary'},{key:'no',label:'Decline',sub:'Smells like trouble.'}]});
  if(c==='yes'){S.contracts.push({to:to.id,due,reward,size});log(`Took a sealed parcel for ${to.name}, due night ${due}, paying ${fmt(reward)}.`,'info');toast(`Parcel for ${to.name} by night ${due}`,'gold','parcel');}
}
async function evStrongbox(){
  const amt=Math.round(rint(200,700)*(1+S.day/8)/10)*10;S.cash+=amt;sfx.sell();log(`Found a drowned strongbox with ${fmt(amt)}.`,'gold');
  await info({art:'strongbox',tone:'luck',kicker:'Lucky find',title:'A drowned strongbox',body:`Your boathook snags a rusted strongbox under the mooring. Inside, wrapped in oilcloth: <b>${fmt(amt)}</b>.`});
}
const ARRIVAL_EVENTS=[
  {id:'crate',w:()=>1,run:evCrate},
  {id:'gull',w:()=>S.cash>800?.9:0,run:evGull},
  {id:'racks',w:()=>!S.racks&&S.day>3?.6:0,run:evRacks},
  {id:'eel',w:()=>S.cash>400?.7:0,run:evFortune},
  {id:'leak',w:()=>cargoCount()>0?(S.hull<60?1.4:.45):0,run:evLeak},
  {id:'tip',w:()=>S.day<NIGHTS?.9:0,run:evTip},
  {id:'courier',w:()=>S.contracts.length<2&&S.day<NIGHTS-2?.8:0,run:evCourier},
  {id:'strongbox',w:()=>.5,run:evStrongbox},
  {id:'collectors',w:()=>S.debt>12000&&S.loc!=='lq'?1.6:0,run:()=>encounter('collectors')}
];
function encounterChance(dest){
  return clamp(.07+.035*DI[dest].danger+Math.min(.12,cargoBaseValue()/300000)-.04*S.motor+(S.day>20?.03:0),.05,.4);
}
function rollVoyageEvent(dest){
  if(S.stats.trips===0)return null;
  const pe=encounterChance(dest),r=rnd();
  if(r<pe){const pPatrol=dest==='fm'?.7:dest==='sl'?.3:.5;return rnd()<pPatrol?'patrol':'gulls';}
  if(r<pe+.06)return 'squall';
  return null;
}
function rollArrivalEvent(){
  if(S.day>=NIGHTS&&rnd()<.5)return null;
  if(rnd()>.42)return null;
  const list=ARRIVAL_EVENTS.map(e=>({e,w:e.w()})).filter(x=>x.w>0);if(!list.length)return null;
  return weighted(list).e.id;
}
function runEvent(id){
  if(id==='patrol'||id==='gulls')return encounter(id);
  if(id==='squall')return evSquall();
  const e=ARRIVAL_EVENTS.find(x=>x.id===id);return e?e.run():Promise.resolve();
}

// =========================================================
//   TRAVEL  (each stage is saved, so a reload resumes mid-voyage
//            instead of letting the player dodge an encounter)
// =========================================================
async function sailTo(did){
  if(busy||S.over||did===S.loc)return;
  if(S.day>=NIGHTS){toast('This is the final night. Settle up instead.','info','flag');return;}
  S.trip={from:S.loc,to:did,stage:'out',ev:rollVoyageEvent(did)};
  save();
  await runTrip(false);
}
async function runTrip(resumed){
  const T=S.trip;if(!T)return;
  busy=true;sel=null;renderTravelCard();
  if(isNarrow())setView('map');
  if(!FAST)await new Promise(r=>requestAnimationFrame(r));
  if(!mapBuilt)buildMap();
  const route=$('#route'),wake=$('#wake');
  route.classList.remove('show');wake.setAttribute('d',voyagePath(T.from,T.to));
  let L=1;try{L=wake.getTotalLength();}catch(e){}
  wake.style.strokeDasharray=L+' '+L;wake.style.strokeDashoffset=String(L);wake.style.opacity='1';
  if(T.stage==='out'){
    sfx.travel();armSkip(true);
    await animSeg(wake,L,0,.5,650);
    T.stage='mid';save();
  }else if(T.stage==='mid')await animSeg(wake,L,.5,.5,0);
  if(T.stage==='mid'){
    if(T.ev){armSkip(false);S.stats.events++;try{await runEvent(T.ev);}catch(err){console.error(err);}T.ev=null;if(S.over){busy=false;return;}save();armSkip(true);}
    else if(!skipVoyage)armSkip(true);
    await animSeg(wake,L,.5,1,650);
    S.stats.trips++;
    advanceDay();
    S.loc=T.to;
    T.first=!S.visited[T.to];S.visited[T.to]=true;
    markSeen();revealNews();
    // deliveries
    for(const c of S.contracts.filter(c=>c.to===T.to)){S.cash+=c.reward;log(`Delivered the sealed parcel. Paid ${fmt(c.reward)}.`,'gold');toast(`Parcel delivered: +${fmt(c.reward)}`,'gold','parcel');sfx.sell();}
    S.contracts=S.contracts.filter(c=>c.to!==T.to);
    log(`Arrived at ${DI[T.to].name}.`);
    const fresh=S.effects.filter(e=>e.known&&e.age===0);
    fresh.forEach(e=>log((e.d===T.to?'Here: ':'Bulletin: ')+e.text,e.type==='crash'?'good':e.type==='spike'?'info':'gold'));
    T.stage='arrived';T.ev=rollArrivalEvent();save();
    wake.style.opacity='0';
    renderAll();
    await nightCard();armSkip(false);
    sfx.arrive();
    if(fresh.length)toast(esc(fresh[0].text),fresh[0].type==='crash'?'good':'gold',fresh[0].type==='spike'?'arrowUp':fresh[0].type==='crash'?'arrowDown':'star',4200);
  }
  wake.style.opacity='0';
  renderAll();
  if(T.ev){S.stats.events++;sfx.event();try{await runEvent(T.ev);}catch(err){console.error(err);}T.ev=null;if(S.over){busy=false;return;}}
  S.trip=null;
  if(T.first)firstVisitHint(T.to);
  if(S.day===NIGHTS){toast('Final night! Sell your cargo, then settle up.','gold','flag',5000);log('The final night. Sell everything and settle up.','gold');}
  else if(S.day===NIGHTS-3)toast('Three nights left. Plan your last runs, and repay Marrow.','info','bell',4000);
  busy=false;renderAll();save();
  if(isNarrow()&&!resumed){await wait(250);setView('market');}
}
function nightCard(){

function save(){if(S&&!S.over)store.set(KEY_SAVE,S);}
// Saved data is untrusted (older versions, other tabs, hand edits): check every field before use.
const isNum=v=>typeof v==='number'&&isFinite(v);
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const STAT_KEYS=['trips','bought','sold','profit','bestFlip','fights','won','fled','bribes','events','interest','vaultEarned','peak','repaid','whispers'];
function migrateSave(s){
  if(isObj(s)&&s.v===1){
    s.press={};DISTRICTS.forEach(d=>{s.press[d.id]={};GOODS.forEach(g=>s.press[d.id][g.id]=0);});
    if(Array.isArray(s.pending))s.pending.forEach(e=>{if(isObj(e)&&e.type!=='fest'){e.conf=e.conf||'likely';e.fate=e.fate||'full';}});
    s.whisperDay=0;s.v=SAVE_V;
  }
  return s;
}
function validEvent(e,aged){return isObj(e)&&['spike','crash','fest'].includes(e.type)&&!!DI[e.d]&&(e.g==='*'||!!GI[e.g])&&isNum(e.m)&&e.m>0&&isNum(e.days)&&typeof e.text==='string'&&(!aged||isNum(e.age))&&(e.type==='fest'||aged||(!!CONF[e.conf]&&['full','weak','turn'].includes(e.fate)));}
function validSave(s){
  try{
    if(!isObj(s)||s.v!==SAVE_V||s.over)return false;
    if(!['day','cash','bank','debt','hull','holdTier','motor','arms'].every(k=>isNum(s[k])))return false;
    if(s.day<1||s.day>NIGHTS||s.cash<0||s.bank<0||s.debt<0||s.hull<=0||s.hull>100)return false;
    if(!DI[s.loc]||!HOLD_TIERS[s.holdTier]||!MOTORS[s.motor]||!ARMS[s.arms])return false;
    if(!GOODS.every(g=>isObj(s.cargo&&s.cargo[g.id])&&isNum(s.cargo[g.id].q)&&s.cargo[g.id].q>=0&&isNum(s.cargo[g.id].cost)&&isNum(s.trend&&s.trend[g.id])))return false;
    for(const k of ['prices','press','local','stock','hist','seen'])if(!isObj(s[k])||!DISTRICTS.every(d=>isObj(s[k][d.id])))return false;
    for(const d of DISTRICTS)for(const g of GOODS){
      if(!isNum(s.prices[d.id][g.id])||s.prices[d.id][g.id]<=0||!isNum(s.press[d.id][g.id])||!isNum(s.local[d.id][g.id]))return false;
      if(typeof s.stock[d.id][g.id]!=='boolean')return false;
      const h=s.hist[d.id][g.id];if(!Array.isArray(h)||!h.length||!h.every(isNum))return false;
      const sn=s.seen[d.id][g.id];if(sn!=null&&!(isObj(sn)&&isNum(sn.p)&&isNum(sn.day)))return false;
    }
    if(!Array.isArray(s.effects)||!s.effects.every(e=>validEvent(e,true)))return false;
    if(!Array.isArray(s.pending)||!s.pending.every(e=>validEvent(e,false)))return false;
    if(!Array.isArray(s.contracts)||!s.contracts.every(c=>isObj(c)&&!!DI[c.to]&&isNum(c.due)&&isNum(c.reward)&&isNum(c.size)))return false;
    if(!Array.isArray(s.log)||!s.log.every(l=>isObj(l)&&typeof l.t==='string'))return false;
    if(!isObj(s.visited)||!isObj(s.hinted))return false;
    if(s.trip!=null&&!(isObj(s.trip)&&!!DI[s.trip.from]&&!!DI[s.trip.to]&&['out','mid','arrived'].includes(s.trip.stage)&&(s.trip.ev==null||typeof s.trip.ev==='string')))return false;
    s.stats=isObj(s.stats)?s.stats:{};STAT_KEYS.forEach(k=>{if(!isNum(s.stats[k]))s.stats[k]=0;});
    if(typeof s.stats.bestFlipGood!=='string')s.stats.bestFlipGood='';
    s.name=typeof s.name==='string'?s.name.slice(0,18):'Captain';s.racks=s.racks===true;s.wireless=s.wireless===true;
    if(!isNum(s.whisperDay))s.whisperDay=0;
    return true;
  }catch(e){return false;}
}
function loadSave(){const s=migrateSave(store.get(KEY_SAVE,null));return validSave(s)?s:null;}
function loadScores(){
  const x=store.get(KEY_SCORES,[]);if(!Array.isArray(x))return[];
  return x.filter(e=>isObj(e)&&isNum(e.score)).map(e=>({name:String(e.name==null?'Captain':e.name).slice(0,18),score:Math.round(e.score),rank:typeof e.rank==='string'?e.rank:rankFor(e.score).name,night:isNum(e.night)?e.night:NIGHTS,sunk:e.sunk===true,date:typeof e.date==='string'?e.date.slice(0,10):'',id:String(e.id==null?Math.random():e.id)})).sort((a,b)=>b.score-a.score).slice(0,10);
}
function startGame(state,isNew){

function confirmSettle(){
  choose({art:'victory',tone:'gold',kicker:'Night '+S.day,title:'Settle up and end the run?',body:`Any cargo still aboard is dumped at half the local price. Your debt is subtracted from your cash and vault. ${S.debt>0&&S.loc!=='lq'?'<b>You still owe Marrow '+fmt(S.debt)+'.</b> It counts against you either way.':''}`,
    choices:[{key:'yes',label:'Settle up',cls:'primary'},{key:'no',label:'Not yet'}],dismissKey:'no'}).then(c=>{if(c==='yes')endGame('complete');});

function tally(reason){
  const sunk=reason==='sunk';
  const cargo=sunk?0:Math.round(cargoValueHere()*.5);
  const cash=sunk?0:S.cash;
  const net=cash+S.bank+cargo-S.debt;
  return{cash,bank:S.bank,cargo,debt:S.debt,net,sunk};
}
async function endGame(reason){
  if(S.over&&reason!=='sunk'&&reason!=='complete')return;
  S.over=true;busy=false;store.del(KEY_SAVE);
  const t=tally(reason),rank=rankFor(t.net);

  const scores=loadScores();scores.push(entry);scores.sort((a,b)=>b.score-a.score);const top=scores.slice(0,10);store.set(KEY_SCORES,top);
  const placed=top.findIndex(x=>x.id===entry.id);

  const html=`<div class="end-hero">
      <div class="kicker">${t.sunk?'Sunk on night '+S.day:'Thirty nights, done'}</div>
      ${emblemSVG(rank)}
      <h3 style="color:${rank.color}">${rank.name}</h3>
      <p class="rankline">${rank.line}</p></div>
    <div class="breakdown">
      <span>Cash on board</span><b>${t.sunk?'lost':fmt(t.cash)}</b>
      <span>Lockwater Vault</span><b>${fmt(t.bank)}</b>
      <span>Cargo dumped at half price</span><b>${t.sunk?'lost':fmt(t.cargo)}</b>
      <span>Owed to Marrow Quill</span><b style="color:#ffb3bc">${t.debt?'−'+fmt(t.debt):'paid off'}</b>
      <span class="tot">Final fortune</span><b class="tot" id="final-n">${fmt(0)}</b>
    </div>
    <div class="statgrid">
      <div>Voyages<b>${S.stats.trips}</b></div><div>Best sale<b>${S.stats.bestFlip?fmtK(S.stats.bestFlip):'—'}</b></div><div>Peak worth<b>${fmtK(S.stats.peak)}</b></div>
      <div>Encounters won<b>${S.stats.won}/${S.stats.fights}</b></div><div>Interest paid<b>${fmtK(S.stats.interest)}</b></div><div>Vault earned<b>${fmtK(S.stats.vaultEarned)}</b></div>
    </div>
    <div class="card-body"><div class="kicker" style="margin-bottom:6px">Captains' Ledger${placed>=0?` · you placed #${placed+1}`:''}</div>${ledgerTable(top,entry.id)}
    <div class="choices end-act" style="grid-template-columns:1fr 1fr"><button class="choice primary" data-choice="again"><kbd>1</kbd><div>Sail again</div></button><button class="choice" data-choice="title"><kbd>2</kbd><div>Title screen</div></button></div></div>`;
  const el=showModal(html,{keepFx:true,cls:'tone-'+(t.net>0&&!t.sunk?'gold':'danger'),wide:true,onKey:e=>{if(e.key==='1')again();if(e.key==='2')toTitle();}});
  const again=()=>{closeModal();openIntro();};const toTitle=()=>{closeModal();showTitle();};
  el.querySelector('[data-choice=again]').onclick=again;el.querySelector('[data-choice=title]').onclick=toTitle;
  const fn=$('#final-n');const t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/1400),e=1-Math.pow(1-k,3);fn.textContent=fmt(t.net*e);if(k<1)requestAnimationFrame(step);};
  if(FAST)fn.textContent=fmt(t.net);else requestAnimationFrame(step);
}

}
const STAT_HELP={
  'st-cash':['Purse','Cash on board. Thieves, tolls and gulls take from it, and it sinks with the skiff. Keep big money in the vault.'],
  'st-bank':['Lockwater Vault','Safe from thieves and the sea, and earns 1.5% a night. Branches at Lanternquay and the Drowned Exchange.'],
  'st-debt':['Debt to Marrow Quill','Grows 6% every night. Repay at Lanternquay. Owe more than ¤12,000 and his collectors start hunting you on the canals.'],
  'st-hold':['Hold','Cargo space used and total. Odile at Copperhook Docks sells bigger racks.'],
  'st-hull':['Hull','At 0% the skiff sinks and you lose your purse and cargo. Below 60% it leaks. Repairs at Copperhook Docks; cheap patches at the Sluices.']
};
function explainStat(id){const h=STAT_HELP[id];if(!h||!S||!$('#modal').hidden)return;info({kicker:'Your ledger',title:h[0],body:h[1],ok:'Got it'});}
function openMenu(){
  if(!S)return;if(busy){toast('Hold on, you are under way.','info','bell',1800);return;}
  choose({kicker:'Paused',title:'Ship\'s menu',body:`Night ${S.day} of ${NIGHTS} · ${S.name}`,dismissKey:'resume',
    choices:[{key:'resume',label:'Resume',cls:'primary'},{key:'help',label:'How to play',sub:'Rules, price colours, and a replay of the guided tour.'},{key:'sound',label:Sound.muted?'Turn sound on':'Turn sound off'},{key:'quit',label:'Save and return to title',sub:'Your voyage is saved automatically.'},{key:'abandon',label:'Abandon this run',sub:'Ends the game now and records your score.',cls:'risk'}]}).then(c=>{
    if(c==='help')openHelp();else if(c==='sound')toggleMute();else if(c==='quit'){save();showTitle();}
    else if(c==='abandon')choose({tone:'danger',title:'Abandon the run?',body:'This settles up right now, as if it were the final night.',choices:[{key:'yes',label:'Yes, settle now',cls:'risk'},{key:'no',label:'Keep sailing',cls:'primary'}],dismissKey:'no'}).then(k=>{if(k==='yes')endGame('complete');});
  });
}

// ---------- guided tour ----------
let coachOpen=false,coachI=0;
const COACH=[
  {sel:'#hud-stats',view:'market',title:'Your ledger',text:'Cash in your <b>purse</b>, savings in the <b>vault</b>, and your <b>debt</b> to Marrow Quill, which grows 6% every night. Watch your <b>hold</b> space and <b>hull</b> too.'},
  {sel:'#side-body .rows',view:'market',title:'The market',text:'Tonight&rsquo;s prices. The coloured % compares each price with its usual level across the city: <b style="color:#4ee39b">green is cheap</b>, a buy; <b style="color:#ffbe55">amber is dear</b>, a sale. Tags say where a good sells for more. Tap a good to trade.'},
  {sel:'#mapwrap',view:'map',title:'The canals',text:'Tap a district to see what it sells cheap and what it pays well for, then tap Sail. <b>Every voyage takes one night</b>, and the water isn\'t always safe.'},
  {sel:'#panel-side',view:'harbor',title:'Harbor services',text:'Repay Marrow and use the vault at Lanternquay. Upgrade your hold and engine at Copperhook Docks. The <b>directory</b> lists every service.'},
  {sel:'#h-night',view:'market',title:'Thirty nights',text:'On night 30, sell everything and settle up. Good luck, captain. Help is under <b>More</b> (or press <kbd>?</kbd>).'}
];
function startCoach(){coachOpen=true;coachI=0;let c=$('#coach');if(!c){c=document.createElement('div');c.id='coach';document.body.appendChild(c);}c.innerHTML='<div class="spot"></div><div class="tip"></div>';c.hidden=false;showCoach();}
function showCoach(){
  const st=COACH[coachI];setView(st.view);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const t=$(st.sel);const c=$('#coach');if(!t||!c)return;const r=t.getBoundingClientRect();
    const sp=c.querySelector('.spot');const pad=6;sp.style.left=(r.left-pad)+'px';sp.style.top=(r.top-pad)+'px';sp.style.width=(r.width+pad*2)+'px';sp.style.height=(Math.min(r.height,innerHeight-r.top-10)+pad*2)+'px';
    const tip=c.querySelector('.tip');
    tip.innerHTML=`<div class="steps">${coachI+1} / ${COACH.length}</div><h3>${st.title}</h3><p>${st.text}</p><div class="row2"><button class="btn ghost sm" data-skip>Skip tour</button><button class="btn primary" data-next>${coachI===COACH.length-1?'Start trading':'Next'} <kbd>⏎</kbd></button></div>`;
    tip.style.animation='none';void tip.offsetWidth;tip.style.animation='';
    const tw=Math.min(340,innerWidth-24);let left=clamp(r.left+r.width/2-tw/2,12,innerWidth-tw-12);let top=r.bottom+14;
    const th=tip.offsetHeight||190;
    if(top+th>innerHeight-12){top=r.top-th-14;}
    if(top<12){top=clamp(r.top+24,12,innerHeight-th-12);left=clamp(r.left+24,12,innerWidth-tw-12);}
    tip.style.left=left+'px';tip.style.top=top+'px';
    tip.querySelector('[data-next]').onclick=()=>coachNext(false);tip.querySelector('[data-skip]').onclick=()=>coachNext(true);
    tip.querySelector('[data-next]').focus({preventScroll:true});
  }));
}
function coachNext(skip){sfx.click();coachI++;if(skip||coachI>=COACH.length){coachOpen=false;const c=$('#coach');if(c)c.remove();settings.tutorial=true;saveSettings();setView('market');toast('Tip: look for <b>Cheap</b> tags, then check the map for where that good sells dear.','gold','bell',6000);return;}showCoach();}

// ---------- boot ----------
updateMuteBtn();
showTitle();
</script>
