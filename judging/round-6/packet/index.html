<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<title>Gloamwater — Thirty Nights on the Drowned Canals</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23ffbe55'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#060916; --night:#0b1230; --deep:#101a40;
  --panel:rgba(15,22,52,.84); --panel2:rgba(26,36,80,.92); --panel3:rgba(255,255,255,.035);
  --line:rgba(140,170,255,.14); --line2:rgba(150,180,255,.28);
  --text:#eef1ff; --muted:#97a3d4; --dim:#8a95c4;
  --amber:#ffbe55; --amber2:#ff8f3c; --teal:#3ce6cf; --rose:#ff5c8f; --violet:#a58bff; --sky:#6cc8ff;
  --up:#4ee39b; --down:#ff6274;
  --r:16px; --shadow:0 12px 40px rgba(0,0,0,.45);
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--text);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
body{background:var(--ink);overflow:hidden;font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1100px 560px at 75% -12%,rgba(255,140,60,.14),transparent 60%),
  radial-gradient(900px 700px at -5% 115%,rgba(60,230,207,.10),transparent 60%),
  linear-gradient(180deg,#0b1130,#060916 70%)}
button{font-family:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
svg{display:block}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}

/* ---------- buttons ---------- */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:rgba(255,255,255,.045);color:var(--text);font:600 14px/1 var(--ui);padding:10px 14px;min-height:44px;border-radius:11px;cursor:pointer;transition:transform .08s,background .15s,border-color .15s,box-shadow .2s;user-select:none;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(170,195,255,.5)}
.btn:active{transform:translateY(1px) scale(.97)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(180deg,#ffd07a,#ff9a3c);color:#2b1400;border-color:transparent;box-shadow:0 6px 22px rgba(255,150,50,.32)}
.btn.primary:hover{background:linear-gradient(180deg,#ffdb94,#ffa850)}
.btn.teal{background:linear-gradient(180deg,rgba(60,230,207,.28),rgba(60,230,207,.12));border-color:rgba(60,230,207,.55);color:#cafff6}
.btn.amber{background:linear-gradient(180deg,rgba(255,190,85,.28),rgba(255,190,85,.1));border-color:rgba(255,190,85,.55);color:#ffe7bf}
.btn.danger{background:linear-gradient(180deg,rgba(255,98,116,.3),rgba(255,98,116,.12));border-color:rgba(255,98,116,.6);color:#ffd5da}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:44px;padding:7px 11px;font-size:13px;border-radius:9px}
.btn.lg{min-height:52px;padding:14px 22px;font-size:16px;border-radius:14px}
.btn.icon{width:44px;min-width:44px;padding:0}
kbd{font:600 11px var(--mono);padding:1px 5px;border-radius:5px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--muted)}
.btn kbd{border-color:rgba(0,0,0,.2);background:rgba(0,0,0,.12);color:inherit;opacity:.9}

/* ---------- app frame ---------- */
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);height:100vh;height:100dvh}
#notice-slot{grid-row:2;min-height:0}
.layout{grid-row:3}
#app.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}
.hud{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(9,14,36,.96),rgba(9,14,36,.78));backdrop-filter:blur(8px);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;margin-right:4px}
.brand .logo{width:30px;height:30px;color:var(--amber);filter:drop-shadow(0 0 8px rgba(255,190,85,.6))}
.brand b{font:700 19px var(--display);letter-spacing:.2em;background:linear-gradient(180deg,#ffe2a8,#ff9f4a);-webkit-background-clip:text;background-clip:text;color:transparent}
.night{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:12px;background:var(--panel3);border:1px solid var(--line)}
.night .moon{width:30px;height:30px}
.night small,.stat small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.night b{font:700 18px var(--mono)}
.night b span{color:var(--muted);font-size:13px}
.nbar{width:70px;height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
.nbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber),var(--rose));border-radius:9px;transition:width .6s}
.stats{display:flex;gap:8px;flex:1;min-width:0}
.stat{position:relative;padding:6px 12px;border-radius:12px;background:var(--panel3);border:1px solid var(--line);min-width:0;flex:1;color:var(--text);text-align:left;font-family:inherit;touch-action:manipulation;cursor:pointer;transition:background .3s,border-color .3s}
.stat b{display:block;font:700 17px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .meter{display:block;height:4px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:4px;overflow:hidden}
.stat .meter i{display:block;height:100%;border-radius:9px;background:var(--teal);transition:width .5s,background .3s}
.stat.debt b{color:#ffb3bc}
.stat.flash-up{background:rgba(78,227,155,.16);border-color:rgba(78,227,155,.5)}
.stat.flash-down{background:rgba(255,98,116,.16);border-color:rgba(255,98,116,.5)}
.stat .delta{position:absolute;right:8px;top:4px;font:700 11px var(--mono);pointer-events:none;animation:floatUp 1.2s forwards}
@keyframes floatUp{from{opacity:1;transform:translateY(4px)}to{opacity:0;transform:translateY(-14px)}}
.hud-btns{display:flex;gap:8px}
.hud-btns .btn{width:44px;padding:0}

.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(400px,1fr);grid-template-rows:minmax(0,1fr) 168px;grid-template-areas:"map side" "log side";gap:12px;padding:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
#panel-map{grid-area:map}
#panel-side{grid-area:side}
#panel-log{grid-area:log}
.phead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
h2{margin:0;font:600 22px/1.15 var(--display);letter-spacing:.01em}
h3{margin:0;font:600 17px/1.2 var(--display)}
.mnav{display:none}

/* ---------- map ---------- */
#mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.map-hint{position:absolute;left:14px;top:12px;font-size:12.5px;color:var(--muted);background:rgba(6,9,22,.6);padding:6px 10px;border-radius:9px;border:1px solid var(--line);pointer-events:none;backdrop-filter:blur(4px)}
.ripples{animation:drift 14s linear infinite}
@keyframes drift{to{transform:translateX(80px)}}
.canal-bed{fill:none;stroke:rgba(80,140,255,.10);stroke-width:30;stroke-linecap:round}
.canal-flow{fill:none;stroke:rgba(120,200,255,.22);stroke-width:1.6;stroke-dasharray:3 14;stroke-linecap:round;animation:flow 3s linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}
.canal-bed.near{stroke:rgba(255,190,85,.17)}
.node.far .disc,.node.far .glyph{opacity:.55}
.node.far .lbl text{fill:#b7c0e6}
.route{fill:none;stroke:var(--amber);stroke-width:3;stroke-dasharray:8 9;stroke-linecap:round;opacity:0;transition:opacity .2s;filter:drop-shadow(0 0 4px rgba(255,190,85,.8))}
.route.show{opacity:.9;animation:flow 1.2s linear infinite}
.wake{fill:none;stroke:rgba(255,220,160,.75);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(255,190,85,.9))}
.win{animation:flick 5s infinite}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}50%{opacity:.25}53%{opacity:1}}
.refl{animation:shimmer 2.6s ease-in-out infinite alternate}
@keyframes shimmer{from{opacity:.25;transform:scaleX(.8)}to{opacity:.6;transform:scaleX(1.15)}}
.node{cursor:pointer}
.node .disc{fill:#121b44;stroke:rgba(170,195,255,.5);stroke-width:2;transition:fill .2s,stroke .2s}
.node .glyph{color:#cfd8ff;transition:color .2s}
.node .halo{fill:var(--amber);opacity:0;transition:opacity .25s}
.node:hover .disc,.node:focus-visible .disc,.node.sel .disc{fill:#1d2a66;stroke:var(--amber)}
.node:hover .glyph,.node.sel .glyph{color:var(--amber)}
.node:focus-visible{outline:none}
.node:focus-visible .disc{stroke-width:4}
.node.here .disc{fill:#3a2a10;stroke:var(--amber);stroke-width:3}
.node.here .glyph{color:#ffd58a}
.node.here .halo{opacity:.22;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.25);opacity:.08}}
.node .halo{transform-box:fill-box;transform-origin:center}
.lbl rect{fill:rgba(6,9,22,.78);stroke:rgba(150,180,255,.2)}
.lbl text{fill:#e6eaff;font:600 19px var(--ui);letter-spacing:.02em}
.node.here .lbl text{fill:#ffd58a}
.pip{fill:rgba(255,255,255,.18)}
.pip.on{fill:var(--rose)}
.badge-g text{font:800 15px var(--mono)}
.badge-pulse{animation:bpulse 1.4s ease-in-out infinite}
@keyframes bpulse{50%{transform:scale(1.15)}}
.badge-pulse{transform-box:fill-box;transform-origin:center}
#skiff .bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px) rotate(-2deg)}}
.tcard{position:absolute;left:12px;right:12px;bottom:12px;max-width:430px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.6);animation:rise .22s ease-out;backdrop-filter:blur(10px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.tc-head{display:flex;gap:12px;align-items:center}
.tc-glyph{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,190,85,.12);color:var(--amber);border:1px solid rgba(255,190,85,.35)}
.tc-glyph .ico{width:26px;height:26px}
.tc-head .x{margin-left:auto}
.tcard p{margin:10px 0 8px;color:#c7cff0;font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.tag.cheap{color:#9ff3c7;border-color:rgba(78,227,155,.4);background:rgba(78,227,155,.08)}
.tag.dear{color:#ffd59a;border-color:rgba(255,190,85,.4);background:rgba(255,190,85,.08)}
.tag.svcs{color:#cdd6ff}
.tl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;align-self:center;min-width:74px}
.tcard.right{left:auto;right:12px}
.tag.hot{color:#2b1400;background:var(--amber);border-color:transparent}
.tag.glut{color:#06291a;background:var(--up);border-color:transparent}
.tag .ico{width:13px;height:13px}
.danger{display:flex;gap:3px;align-items:center;font-size:12px;color:var(--muted)}
.danger i{width:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.14)}
.danger i.on{background:var(--rose);box-shadow:0 0 6px rgba(255,92,143,.7)}
.tc-known{display:grid;grid-template-columns:1fr auto auto;gap:3px 10px;font-size:12.5px;margin:8px 0 10px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.2)}
.tc-known .h{color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.tc-act{display:flex;gap:8px;align-items:center}
.tc-act .btn.primary{flex:1}

/* ---------- side panel / market ---------- */
.tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:700 13px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;position:relative;display:flex;align-items:center;gap:7px}
.tab[aria-selected=true]{color:var(--text);background:rgba(255,255,255,.05)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--amber);border-radius:2px}
.tab .cnt{font-size:11px;background:rgba(255,190,85,.2);color:var(--amber);padding:1px 6px;border-radius:99px}
.scroll{overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(150,180,255,.25) transparent}
.mk-head{display:flex;align-items:flex-end;gap:12px;padding:14px 16px 8px}
.mk-head .holdbox{margin-left:auto;text-align:right}
.mk-head .holdbox b{font:700 16px var(--mono)}
.bulletins{margin:4px 12px 8px;display:flex;flex-direction:column;gap:6px}
.bull{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:11px;font-size:13px;background:rgba(255,255,255,.04);border:1px solid var(--line);cursor:pointer;text-align:left;color:var(--text);width:100%;font-family:inherit}
.bull:hover{background:rgba(255,255,255,.07)}
.bull .ico{margin-top:1px}
.bull.spike{border-color:rgba(255,190,85,.5);background:rgba(255,190,85,.08)}
.bull.spike .ico{color:var(--amber)}
.bull.crash{border-color:rgba(78,227,155,.45);background:rgba(78,227,155,.07)}
.bull.crash .ico{color:var(--up)}
.bull.fest{border-color:rgba(165,139,255,.5);background:rgba(165,139,255,.08)}
.bull.fest .ico{color:var(--violet)}
.bull small{color:var(--muted);display:block;margin-top:2px}
.final-banner{margin:4px 12px 10px;padding:12px 14px;border-radius:12px;background:linear-gradient(90deg,rgba(255,92,143,.22),rgba(255,190,85,.18));border:1px solid rgba(255,190,85,.45);display:flex;align-items:center;gap:12px;font-size:13.5px}
.final-banner .btn{margin-left:auto}
.final-banner{position:relative;background:linear-gradient(90deg,#3a1d3e,#3a2a1c)}
.rows{display:flex;flex-direction:column;gap:6px;padding:4px 10px 12px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) 76px 90px auto;grid-template-areas:"ico name spark price act";align-items:center;gap:10px;padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.row:hover{background:rgba(255,255,255,.065)}
.row.sel{border-color:rgba(255,190,85,.55);background:rgba(255,190,85,.06)}
.row.out{background:transparent;border:1px dashed var(--line)}
.row.out .gico{opacity:.45}
.row.out .gname b{color:var(--muted)}
.row.flash{animation:rowflash .7s}
@keyframes rowflash{from{background:rgba(255,190,85,.3)}}
.gico{grid-area:ico;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.gico .ico{width:24px;height:24px}
.gname{grid-area:name;min-width:0}
.gname b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gname .tags{margin:3px 0 0;gap:4px;flex-wrap:wrap}
.gname .tag{font-size:10.5px;padding:1px 6px}
.spark{grid-area:spark;width:76px;height:30px}
.gprice{grid-area:price;text-align:right}
.gprice b{display:block;font:700 15.5px var(--mono);font-variant-numeric:tabular-nums}
.chg{font:600 11.5px var(--mono);white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)} .cheapv{color:var(--up)} .dearv{color:var(--amber)}
.tag.sale{color:#ffe2b0;border-color:rgba(255,190,85,.45);background:rgba(255,190,85,.1)}
.gact{grid-area:act;display:flex;gap:8px}
.tag.own{color:var(--text);background:rgba(255,255,255,.1);border-color:var(--line2);font-family:var(--mono)}
.tag.own .up,.tag.own .down{font-weight:700}
.chev{display:none;color:var(--dim)}
.mk-foot{padding:10px 16px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}

/* ---------- harbor ---------- */
.harbor{padding:12px;display:grid;gap:10px}
.svc{padding:14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.svc-h{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--ac,#ffbe55);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--ac,#ffbe55) 40%,#111),#0b1028);color:var(--ac,#ffbe55)}
.avatar .ico{width:24px;height:24px}
.avatar svg:not(.ico){width:42px;height:42px}
.svc p{margin:4px 0 10px;font-size:13px;color:#c2caef}
.svc .q{font-style:italic;color:var(--muted)}
.svc-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;margin:6px 0 10px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);text-align:right}
.upg{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:rgba(0,0,0,.18);margin-top:8px}
.upg .info{flex:1;min-width:0;font-size:13px}
.upg .info b{display:block;font-size:14px}
.upg .info span{color:var(--muted);font-size:12px}
.tiers{display:flex;gap:4px;margin-top:5px}
.tiers i{width:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.tiers i.on{background:var(--amber)}
.directory{font-size:12.5px;color:var(--muted);display:grid;gap:6px}
.directory div{display:flex;gap:8px;align-items:center}
.directory b{color:var(--text);font-weight:600}

/* ---------- log ---------- */
.logs{padding:6px 14px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.lg{display:flex;gap:10px;padding:3px 0;color:#c8d0f0;animation:fadeIn .4s}
.lg .d{font:600 11px var(--mono);color:var(--dim);min-width:30px;padding-top:2px}
.lg.good{color:#b8f5d6}.lg.bad{color:#ffc0c8}.lg.gold{color:#ffe0a6}.lg.info{color:#bfe9ff}
@keyframes fadeIn{from{opacity:0;transform:translateX(-6px)}}
.worth{margin-left:auto;text-align:right}
.worth b{font:700 16px var(--mono)}

/* ---------- modal / cards ---------- */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(3,5,14,.66);backdrop-filter:blur(5px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:linear-gradient(180deg,#182358,#0e1538);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.65);animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.95)}}
.modal.wide{width:min(640px,100%)}
.art{height:150px;position:relative;overflow:hidden;border-radius:19px 19px 0 0}
.art svg{width:100%;height:100%}
.card-body{padding:18px 20px 20px}
.card-body h3{font-size:24px;margin:2px 0 8px}
.card-body p{margin:0 0 12px;color:#cdd5f6;font-size:14.5px}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;font:600 15px var(--ui);transition:background .15s,transform .08s,border-color .15s}
.choice:hover{background:rgba(255,255,255,.1);border-color:var(--amber)}
.choice:active{transform:scale(.985)}
.choice[disabled]{opacity:.62;cursor:not-allowed;border-style:dashed}
.choice kbd{flex:none}
.choice small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.choice.primary{background:linear-gradient(180deg,rgba(255,190,85,.25),rgba(255,190,85,.1));border-color:rgba(255,190,85,.55)}
.choice.risk{border-color:rgba(255,98,116,.45)}
.tone-danger .modal{border-color:rgba(255,98,116,.6);box-shadow:0 0 0 1px rgba(255,98,116,.3),0 30px 80px rgba(120,0,20,.5)}
.tone-luck .modal{border-color:rgba(78,227,155,.5)}
.tone-gold .modal{border-color:rgba(255,190,85,.6)}
.result{padding:10px 12px;border-radius:11px;font-size:14px;margin:0 0 10px;animation:pop .3s}
.result.good{background:rgba(78,227,155,.12);border:1px solid rgba(78,227,155,.4);color:#c6f7de}
.result.bad{background:rgba(255,98,116,.12);border:1px solid rgba(255,98,116,.45);color:#ffd2d8}
.result.info{background:rgba(108,200,255,.1);border:1px solid rgba(108,200,255,.4);color:#d2eeff}
.enc-stats{display:flex;gap:10px;margin:8px 0 4px}
.enc-stats>div{flex:1;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.25);font-size:12px;color:var(--muted)}
.enc-stats b{display:block;font:700 15px var(--mono);color:var(--text)}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--up);transition:width .5s}

/* trade sheet */
.sheet .sh-head{display:flex;gap:12px;align-items:center;padding:16px 18px 6px}
.sheet .sh-head .gico{width:50px;height:50px}
.sheet .sh-head .gico .ico{width:30px;height:30px}
.sheet .sh-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.sheet .x{margin-left:auto;align-self:flex-start}
.chart{margin:6px 14px 0;height:140px;position:relative}
.chart svg{width:100%;height:100%}
.chart text{font:600 11px var(--mono);fill:var(--muted)}
.gauge{margin:8px 18px 4px;font-size:11.5px;color:var(--muted)}
.gauge .track{position:relative;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--up),#9fb0e6 50%,var(--amber));margin:5px 0 3px;opacity:.85}
.gauge .mk{position:absolute;top:-4px;width:4px;height:16px;border-radius:3px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.5);transform:translateX(-2px)}
.gauge .ends{display:flex;justify-content:space-between}
.else{margin:8px 14px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:5px}
.else div{font-size:12px;padding:6px 9px;border-radius:9px;background:rgba(255,255,255,.04);display:flex;justify-content:space-between;gap:6px}
.else div span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quote-age{color:var(--muted);opacity:1}
.else div b{font-family:var(--mono)}
.else div.best{background:rgba(255,190,85,.12);outline:1px solid rgba(255,190,85,.4)}
.else div.low{background:rgba(78,227,155,.1);outline:1px solid rgba(78,227,155,.35)}
.seg{display:flex;margin:14px 18px 0;background:rgba(0,0,0,.3);border-radius:12px;padding:4px}
.seg button{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:700 14px var(--ui);padding:10px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed=true].b{background:rgba(60,230,207,.2);color:#bffbf1}
.seg button[aria-pressed=true].s{background:rgba(255,190,85,.2);color:#ffe2b0}
.qty{display:flex;gap:8px;align-items:center;margin:12px 18px 0}
.qty input[type=number]{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--text);font:700 22px var(--mono);text-align:center;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.qty .btn{height:48px;min-width:48px;font-size:18px}
input[type=range]{width:calc(100% - 36px);margin:12px 18px 0;accent-color:var(--amber);height:28px}
.summary{margin:10px 18px 0;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.22);display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.summary span{color:var(--muted)}
.summary b{font-family:var(--mono);text-align:right}
.summary .depth-ok{color:var(--muted);font-size:12.5px}
.summary .depth-warn{color:#ffd59a;font-size:12.5px}
.sh-foot{display:flex;gap:8px;padding:14px 18px 18px}
.sh-foot .btn.lg{flex:1}
.trade-intel{margin:10px 14px 0;border:1px solid var(--line);border-radius:12px}
.trade-intel>summary{min-height:44px;padding:10px 12px;font-size:15px;color:var(--muted);cursor:pointer;touch-action:manipulation}
.trade-intel[open]{padding-bottom:12px}
.trade-intel .intel-note{margin:8px 14px 0;font-size:15px;color:var(--muted)}
.tab,.seg button{min-height:44px}
.amt-presets{display:flex;gap:6px;margin:10px 18px 0;flex-wrap:wrap}
.amt-presets .btn{flex:1}

/* toasts */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(460px,calc(100% - 24px))}
.toast{pointer-events:none;display:flex;gap:10px;align-items:center;padding:11px 15px;border-radius:13px;background:rgba(20,28,66,.96);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.5);font-size:14px;animation:tin .3s cubic-bezier(.2,1.3,.4,1);max-width:100%}
.toast.out{animation:tout .3s forwards}
.toast.good{border-color:rgba(78,227,155,.6)} .toast.good .ico{color:var(--up)}
.toast.bad{border-color:rgba(255,98,116,.6)} .toast.bad .ico{color:var(--down)}
.toast.gold{border-color:rgba(255,190,85,.6)} .toast.gold .ico{color:var(--amber)}
.toast.info .ico{color:var(--sky)}
#toasts.docked{position:static;transform:none;left:auto;bottom:auto;width:auto;margin:0 8px;align-items:stretch;gap:6px;padding-top:6px;z-index:auto}
#toasts.docked:empty{display:none}
#toasts.docked .toast{width:100%;min-height:36px;padding:7px 10px;gap:8px;font-size:15px;line-height:1.25;box-shadow:none;border-radius:9px;align-items:center;animation:none}
#toasts.docked .toast.out{opacity:0;transition:opacity .2s}
#toasts.docked .toast>div{flex:1;min-width:0}
.toast .read-notice{pointer-events:auto;min-height:44px;flex:none;padding:8px 12px;font-size:15px}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.95)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.flyer{position:fixed;z-index:80;pointer-events:none;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#ffbe55 45%,#c46a10);box-shadow:0 0 10px rgba(255,190,85,.8)}
.flyer.box{border-radius:4px;background:var(--c,#3ce6cf);box-shadow:0 0 10px var(--c,#3ce6cf)}
.floattext{position:fixed;z-index:81;pointer-events:none;font:800 18px var(--mono);text-shadow:0 2px 10px rgba(0,0,0,.8);animation:ftext 1.4s ease-out forwards}
@keyframes ftext{0%{opacity:0;transform:translate(-50%,0) scale(.8)}15%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:85}

/* night card */
.nightcard{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(5,8,20,.75),rgba(5,8,20,.92));animation:nc 1.05s forwards}
.nightcard em{display:block;margin-top:14px;font:600 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-style:normal}
.nightcard div{text-align:center}
.nightcard small{display:block;font:700 13px var(--ui);letter-spacing:.4em;color:var(--amber);text-transform:uppercase}
.nightcard b{display:block;font:600 54px var(--display);letter-spacing:.04em;margin:6px 0}
.nightcard span{color:var(--muted);font-size:15px}
@keyframes nc{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* title */
#title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#0b1030 0%,#151b4a 45%,#2b1f4a 58%,#08102a 60%,#050817 100%)}
#title .scene{position:absolute;inset:0;width:100%;height:100%}
.tt-inner{position:relative;text-align:center;padding:20px;max-width:900px;margin-top:-6vh}
.tt-inner h1{margin:0;font:600 clamp(34px,9.6vw,92px)/1.1 var(--display);letter-spacing:.12em;white-space:nowrap;background:linear-gradient(180deg,#fff1cf,#ffbe55 55%,#ff7a3c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(255,160,60,.45));padding-left:.14em}
.tt-inner .sub{font:italic 500 clamp(15px,2.4vw,19px) var(--display);color:#d9ddff;margin:12px 0 30px;opacity:.9}
.tt-btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.tt-btns .btn{min-width:240px}
.tt-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tt-row{flex-wrap:nowrap}
.tt-row .btn{min-width:0}
@media (min-width:520px){.tt-row .btn{min-width:115px}}
.tt-foot{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.lantern-p{position:absolute;bottom:-30px;width:10px;height:14px;border-radius:40% 40% 45% 45%;background:radial-gradient(circle at 50% 60%,#fff2c0,#ffae42 50%,#d4561a);box-shadow:0 0 16px 4px rgba(255,160,60,.5);animation:lrise linear infinite;opacity:.9}
@keyframes lrise{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-55vh) translateX(18px)}100%{transform:translateY(-115vh) translateX(-10px);opacity:0}}

/* score */
.ledger{width:100%;border-collapse:collapse;font-size:13.5px}
.ledger th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.ledger td{padding:7px 8px;border-bottom:1px solid rgba(140,170,255,.07)}
.ledger td.n{font-family:var(--mono);text-align:right}
.ledger tr.me td{background:rgba(255,190,85,.13);color:#ffe3ad}
.ledger .rk{font-size:12px;color:var(--muted)}
.end-hero{text-align:center;padding:24px 20px 6px}
.emblem{width:120px;height:120px;margin:0 auto 6px;animation:emb 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes emb{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.end-hero h3{font-size:30px}
.end-hero .rankline{color:var(--muted);font-style:italic;margin:6px 0 0;font-family:var(--display)}
.breakdown{margin:14px 20px 0;display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.25)}
.breakdown span{color:var(--muted)}
.breakdown b{font-family:var(--mono);text-align:right}
.breakdown .tot{border-top:1px solid var(--line2);padding-top:8px;font-size:17px;color:var(--text)}
.breakdown .tot b{color:var(--amber);font-size:20px}
.breakdown>*{animation:fadeIn .4s backwards}
.statgrid{margin:10px 20px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.statgrid div{padding:8px;border-radius:10px;background:rgba(255,255,255,.04);font-size:11px;color:var(--muted);text-align:center}
.statgrid b{display:block;font:700 15px var(--mono);color:var(--text)}
.help h4{margin:14px 0 4px;font:600 16px var(--display);color:var(--amber);display:flex;gap:8px;align-items:center}
.help p,.help li{font-size:13.5px;color:#cbd3f4;margin:0 0 6px}
.help ul{padding-left:18px;margin:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;color:#cbd3f4}
.namein{width:100%;height:46px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--text);font:600 16px var(--ui);padding:0 14px;margin-top:6px}

/* coach */
#coach{position:fixed;inset:0;z-index:90}
#coach .spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(3,5,14,.72);border:2px solid var(--amber);transition:all .35s cubic-bezier(.3,1,.4,1);pointer-events:none}
#coach .tip{position:fixed;width:min(340px,calc(100vw - 24px));background:linear-gradient(180deg,#1f2b68,#141c48);border:1px solid rgba(255,190,85,.6);border-radius:16px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
#coach .tip p{margin:6px 0 12px;font-size:14px;color:#d4dbfa}
#coach .tip .steps{font:700 11px var(--mono);color:var(--muted)}
#coach .tip .row2{display:flex;gap:8px;align-items:center}
#coach .tip .row2 .btn.primary{margin-left:auto}

/* ---------- touch behaviour ---------- */
html{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior:none}
.scroll,.modal,.tcard,.tc-body{overscroll-behavior:contain}
button,.btn,.row,.choice,.bull,.tab,.node,.stat,.mnav button,.seg button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hud-worth{display:none}
.tc-body{overflow:auto;min-height:0;flex:1 1 auto}
.tcard{display:flex;flex-direction:column}
.tc-act{flex:none;padding-top:10px}
.sh-foot{position:sticky;bottom:0;z-index:3;background:linear-gradient(180deg,rgba(14,21,56,0),#0f1638 22%);margin-top:6px}
.end-act{position:sticky;bottom:0;z-index:3;padding:10px 0 4px;background:linear-gradient(180deg,rgba(14,21,56,0),#0e1538 30%)}
.result.gold{background:rgba(255,190,85,.12);border:1px solid rgba(255,190,85,.45);color:#ffe7bf}
.chart .cl{position:absolute;transform:translateY(-50%);font:600 12px var(--mono);color:var(--muted);white-space:nowrap;pointer-events:none}
.chart .cl.cx{transform:translate(-50%,-50%)}
.chart .cl.ca{transform:translate(-100%,-50%);color:var(--amber)}
.nextrank{text-align:center;margin:10px 20px 0;color:var(--muted);font-size:14px}
.statgrid small{display:block;font-size:11px;color:var(--muted)}
.hud-mute{display:none}
.hud-worth em{font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.tag{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.modal,.scroll,.tc-body{scrollbar-width:thin;scrollbar-color:rgba(150,180,255,.3) transparent}
.modal::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:8px}.modal::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:rgba(150,180,255,.28);border-radius:8px}.modal::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{background:transparent}
.tc-dist{font-size:13px;color:var(--amber);font-weight:600}
.best-run{margin:0 12px 8px;padding:9px 12px;border-radius:11px;font-size:13px;background:rgba(78,227,155,.07);border:1px solid rgba(78,227,155,.35);color:#c6f7de;display:flex;gap:8px;align-items:center}
.best-run .ico{color:var(--up);flex:none}
.best-run small{display:block;color:var(--muted);font-size:.9em}
.best-run{width:calc(100% - 24px);font-family:inherit;text-align:left;cursor:pointer}
.best-run>div{min-width:0}
.row-note{display:none}
.market-info{margin-left:auto;flex:none}
.port-sheet .tc-known{margin:12px 0}
.port-sheet .choices{position:sticky;bottom:0;padding-top:12px;background:var(--panel2)}
.stat-help{cursor:help}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr) 390px}
  .brand b{display:none}
  .row{grid-template-columns:38px minmax(0,1fr) 60px 86px 14px;grid-template-areas:"ico name spark price chev"}
  .spark{width:60px}
  .gact{display:none}
  .chev{display:block;grid-area:chev}
}
@media (max-width:860px){
  /* ---- phone: thumb-first layout. Body 16px, controls 44px, everything actionable in the lower half ---- */
  body{font-size:16px}
  .hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  .brand,.hud-btns{display:none}
  .night{padding:4px 10px}
  .night .moon{width:26px;height:26px}
  .night small,.stat small{font-size:12px;letter-spacing:.04em}
  .night{padding:3px 10px}.night .moon{width:22px;height:22px}.nbar{margin-top:3px}
  .hud-mute{display:inline-flex;min-height:44px}
  .hud-worth em{font-size:12px}
  .night b{font-size:16px}
  .nbar{width:56px}
  .hud-worth{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:2px 4px;min-width:0}
  .hud-worth small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .hud-worth b{font:700 19px var(--mono);font-variant-numeric:tabular-nums;color:var(--amber);white-space:nowrap}
  .stats{grid-column:1/4;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
  .stat{padding:5px 6px;border-radius:10px;min-height:46px;cursor:pointer;-webkit-user-select:none;user-select:none}
  .stat b{font-size:15px;letter-spacing:-.04em}
  .stat .delta{top:auto;bottom:-2px;right:4px;font-size:12px}
  .layout{display:block;padding:8px;padding-bottom:calc(74px + env(safe-area-inset-bottom));height:100%}
  .panel{display:none;height:100%}
  body[data-view=map] #panel-map,body[data-view=log] #panel-log,body[data-view=market] #panel-side,body[data-view=harbor] #panel-side{display:flex}
  #panel-map>.phead{display:none}
  #panel-side .tabs{display:none}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,12,32,.97);border-top:1px solid var(--line2);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));gap:4px;backdrop-filter:blur(8px)}
  .mnav{gap:8px!important}
  .mnav button{flex:1;min-width:0;min-height:54px;appearance:none;background:none;border:0;color:var(--muted);font:700 13px var(--ui);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0;border-radius:10px;cursor:pointer;position:relative}
  .mnav button .ico{width:24px;height:24px}
  .mnav button[aria-selected=true]{color:var(--amber);background:rgba(255,190,85,.1)}
  .mnav .dot{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--rose)}
  .btn{min-height:44px;font-size:15px}
  .btn.sm{min-height:44px;font-size:14px;padding:8px 12px}
  .btn.icon{width:44px;min-width:44px}
  .kicker{font-size:12px}
  .tag{font-size:13px;padding:2px 8px}
  .gname .tag{font-size:13px;padding:2px 7px;flex:0 1 auto;min-width:0}
  .gname .tag:nth-child(n+4){display:none}
  .spark{display:block;grid-area:spark;width:38px;height:24px}
  .row{grid-template-areas:"ico name spark price" "note note note note"!important;grid-template-columns:28px minmax(0,1fr) 38px auto!important;column-gap:7px;row-gap:1px;padding:4px 8px;min-height:60px}
  .rows{gap:5px;padding:4px 8px 12px}
  .gname .tags{display:none}
  .row-note{display:block;grid-area:note;font-size:15px;line-height:1.1;color:var(--muted);overflow-wrap:anywhere}
  .row-note .route-name{color:#bffbf1;font-weight:600}
  .gname .tag{padding:1px 5px;border:0;font-size:13px;flex:none}
  .gname .tag:nth-child(n+2){display:none}
  .gname .tag.hot,.gname .tag.glut{display:inline-flex}
  .gname .tag .ico{display:none}
  .gname b{font-size:16px}
  .gprice{line-height:1}
  .gprice b{font-size:17px;line-height:1.05}
  .chg{display:block;font-size:13.5px;line-height:1.05}
  .chev,.vsu{display:none}
  .gico{width:28px;height:28px;border-radius:9px}
  .bull{font-size:14.5px;min-height:48px;padding:8px 11px}

// ---------- state ----------
let S=null;

function capacity(){return HOLD_TIERS[S.holdTier].cap+(S.racks?15:0);}
function holdUsed(){let n=0;for(const g of GOODS)n+=S.cargo[g.id].q;for(const c of S.contracts)n+=c.size;return n;}
// ---- market depth ----
// Dealers trade about `n` units of a good at the posted price each night. Past that, every `d` more
// units moves the price by a factor of e (down when you sell, up when you buy). Specialty markets
// (a district's cheap or dear goods) are half again as deep. Pressure eases 60% each night.
// Trades are priced by integrating the curve, so a buy-then-sell round trip can never make money.
function depthOf(did,gid,day=S.day){const g=GI[gid],d=DI[did],f=fleetCall(day),k=((d.cheap.includes(gid)||d.dear.includes(gid))?1.5:1)*(S.charters&&S.charters[did]?CHARTER_DEPTH:1)*(f&&f.d===did&&f.g===gid?f.depth:1);return{n:g.depth[0]*k,d:g.depth[1]*k};}
// A trading charter makes a district's dealers trade twice as deep with you: the late-game home for capital.
const CHARTER_DEPTH=2,charterCost=()=>20000+20000*Object.keys(S.charters||{}).length;
function pressF(x,n,d){return x>n?Math.exp((x-n)/d):x<-n?Math.exp((x+n)/d):1;}
function pressInt(a,b,n,d){
  let s=0;const e=Math.exp;
  if(Math.min(b,-n)>a)s+=d*(e((Math.min(b,-n)+n)/d)-e((a+n)/d));
  const l2=Math.max(a,-n),h2=Math.min(b,n);if(h2>l2)s+=h2-l2;
  if(b>Math.max(a,n))s+=d*(e((b-n)/d)-e((Math.max(a,n)-n)/d));
  return s;
}
function postedAt(did,gid){const k=depthOf(did,gid);return Math.max(1,Math.round(S.prices[did][gid]*pressF(S.press[did][gid],k.n,k.d)));}
function price(gid){return postedAt(S.loc,gid);}
function quoteBuy(gid,q){if(q<=0)return 0;const k=depthOf(S.loc,gid),x=S.press[S.loc][gid];return Math.ceil(S.prices[S.loc][gid]*pressInt(x,x+q,k.n,k.d)-1e-6);}
function quoteSell(gid,q){if(q<=0)return 0;const k=depthOf(S.loc,gid),x=S.press[S.loc][gid];return Math.max(0,Math.floor(S.prices[S.loc][gid]*pressInt(x-q,x,k.n,k.d)+1e-6));}
// units the dealers here will take before the price starts to move (for the trade sheet)
function flatLeft(gid,mode){const k=depthOf(S.loc,gid),x=S.press[S.loc][gid];
  if(mode==='buy')return x< -k.n?0:Math.max(0,Math.floor(k.n-x));
  return x>k.n?0:Math.max(0,Math.floor(k.n+x));}

// ---------- market engine ----------
function stepMarket(warm){return marketDice(()=>stepMarketInner(warm));}
function stepMarketInner(warm){
  S.effects=S.effects.map(e=>Object.assign({},e,{age:e.age+1})).filter(e=>e.age<e.days);
  if(!warm){S.pending.forEach(e=>{const l=landEvent(e);if(l)S.effects.push(l);});S.pending=[];genPending();}
  DISTRICTS.forEach(d=>GOODS.forEach(g=>{const x=S.press[d.id][g.id]*.4;S.press[d.id][g.id]=Math.abs(x)<.5?0:x;}));
  GOODS.forEach(g=>{S.trend[g.id]=clamp(S.trend[g.id]*.85+gauss()*g.vol*.6,-.6,.6);});
  DISTRICTS.forEach(d=>{
    let count=0;
    GOODS.forEach(g=>{
      const L=S.local[d.id];L[g.id]=clamp(L[g.id]*.65+gauss()*.1,-.35,.35);
      let p=clamp(g.base*mult(d,g)*Math.exp(S.trend[g.id]+L[g.id]),g.min,g.max);
      const em=effectMult(d.id,g.id);
      p=clamp(p*em,g.min*.4,g.max*1.6);
      p=Math.max(1,Math.round(p));
      S.prices[d.id][g.id]=p;S.hist[d.id][g.id].push(postedAt(d.id,g.id));
      if(S.hist[d.id][g.id].length>40)S.hist[d.id][g.id].shift();
      const st=fleetMult(d.id,g.id)>1||em!==1||rnd()<(mult(d,g)!==1?.95:.8);
      S.stock[d.id][g.id]=st;if(st)count++;
    });
    let guard=0;
    while(count<5&&guard++<50){const g=pick(GOODS);if(!S.stock[d.id][g.id]){S.stock[d.id][g.id]=true;count++;}}
  });
}
function genPending(){return marketDice(genPendingInner);}
function genPendingInner(){
  const n=rnd()<.82?(rnd()<.4?2:1):0;
  for(let i=0;i<n;i++){
    const d=pick(DISTRICTS),g=pick(GOODS),r=rnd();let e;
    if(S.pending.some(x=>x.d===d.id))continue;
    if(r<.46)e={type:'spike',d:d.id,g:g.id,m:2+rnd()*1.5,days:2,text:pick(SPIKE_TXT)};
    else if(r<.92)e={type:'crash',d:d.id,g:g.id,m:.3+rnd()*.22,days:2,text:pick(CRASH_TXT)};
    else e={type:'fest',d:d.id,g:'*',m:1.3,days:1,text:pick(FEST_TXT)};
    e.text=fillTxt(e.text,d,g);
    if(e.type!=='fest'){
      const c=weighted(Object.keys(CONF).map(k=>({k,w:CONF[k].w}))).k,o=CONF[c].odds,f=rnd();
      e.conf=c;e.fate=f<o[0]?'full':f<o[0]+o[1]?'weak':'turn';
    }
    S.pending.push(e);
  }
}
// turn a queued rumour into the shock that actually lands, according to its fate
function landEvent(p){
  const e=Object.assign({},p,{age:0,told:p.type});

// ---------- trading ----------
// both return {q,total} (sell adds profit) or null; quantities are clamped to what is possible
function coreBuy(gid,q){
  q=Math.min(Math.floor(q)||0,maxBuy(gid));
  if(q<=0)return null;
  const total=quoteBuy(gid,q),c=S.cargo[gid];
  c.cost=(c.cost*c.q+total)/(c.q+q);c.q+=q;S.cash-=total;S.press[S.loc][gid]+=q;S.stats.bought+=q;
  if(c.lot&&c.lot.d===S.loc&&c.lot.day===S.day)c.lot.q+=q;else c.lot={d:S.loc,day:S.day,q};
  return {q,total};
}
function coreSell(gid,q){
  const c=S.cargo[gid];q=Math.min(Math.floor(q)||0,c.q);
  if(q<=0||!S.stock[S.loc][gid])return null;
  const total=quoteSell(gid,q);
  let basis=c.cost*q;
  const lot=c.lot;
  if(lot&&lot.d===S.loc&&lot.day===S.day&&lot.q>0){
    // unwind tonight's buys first: those units cost what selling them back fetches
    const k=Math.min(q,lot.q),back=quoteSell(gid,k),restQ=c.q-k,restCost=Math.max(0,c.cost*c.q-back);
    basis=back+(q-k)*(restQ>0?restCost/restQ:0);lot.q-=k;
  }
  const profit=Math.round(total-basis);
  const left=c.q-q,leftCost=Math.max(0,c.cost*c.q-basis);
  S.cash+=total;c.q=left;c.cost=left>0?leftCost/left:0;if(!left)delete c.lot;S.press[S.loc][gid]-=q;
  S.stats.sold+=q;S.stats.profit+=profit;
  if(profit>S.stats.bestFlip){S.stats.bestFlip=profit;S.stats.bestFlipGood=GI[gid].name;}
  return {q,profit,total};
}

function bestKnownRoute(){
  let best=null;if(S.day>=NIGHTS)return null;
  GOODS.forEach(g=>{
    const q=S.stock[S.loc][g.id]?suggestBuy(g.id):0,cargo=S.cargo[g.id];
    DISTRICTS.forEach(d=>{
      if(d.id===S.loc)return;
      const sn=S.seen[d.id][g.id],nights=nightsTo(S.loc,d.id);
      if(!sn||!sn.st||S.day-sn.day>FRESH_NIGHTS||(sn.sh&&S.day-sn.day>=2)||S.day+nights>NIGHTS)return;
      const depth=Math.max(1,Math.floor(depthOf(d.id,g.id).n));
      if(q){
        const amount=Math.min(q,depth),each=quoteBuy(g.id,amount)/amount,edge=sn.p/each-1,value=(sn.p-each)*amount/nights;
        if(edge>.12&&(!best||value>best.value))best={g,d,q:amount,edge,value,ago:S.day-sn.day,nights,mode:'buy'};
      }
      if(cargo.q){
        const amount=Math.min(cargo.q,depth),each=quoteSell(g.id,amount)/amount,edge=sn.p/each-1,value=(sn.p-each)*amount/nights;
        if(edge>.12&&(!best||value>best.value))best={g,d,q:amount,edge,value,ago:S.day-sn.day,nights,mode:'carry'};
      }
    });
  });
  return best;
}

const FRESH_NIGHTS=2; // a recent sighting is context, never a promised arrival price
// Default buys stay within flat depth and leave 15% of the purse for repairs and tolls.
// One affordable unit stays selectable when it alone uses that reserve. Max is an explicit choice.
function suggestBuy(gid){
  const mx=maxBuy(gid);if(!mx)return 0;
  const bound=Math.min(mx,flatLeft(gid,'buy')),budget=Math.floor(S.cash*.85);
  if(bound<=0)return 0; // exhausted flat depth requires an explicit quantity or Max
  let lo=0,hi=bound;
  while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(quoteBuy(gid,mid)<=budget)lo=mid;else hi=mid-1;}
  return Math.max(1,lo);
}
function bestSeen(gid){let best=null;DISTRICTS.forEach(d=>{if(d.id===S.loc)return;const sn=S.seen[d.id][gid];if(sn&&sn.st&&S.day-sn.day<=FRESH_NIGHTS&&!(sn.sh&&S.day-sn.day>=2)&&(!best||sn.p>best.p))best={d,p:sn.p,ago:S.day-sn.day};});return best;}

function marketRowNote(gid,stocked){

function voyagePath(a,b){const A=pos(a),B=pos(b);const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1,bend=len*.16;

function animSeg(route,L,from,to,dur){
  const sk=$('#skiff'),wake=$('#wake');
  const place=u=>{const pt=route.getPointAtLength(u*L),p2=route.getPointAtLength(Math.min(L,u*L+2));let ang=Math.atan2(p2.y-pt.y,p2.x-pt.x)*180/Math.PI;
    const flip=Math.abs(ang)>90;sk.setAttribute('transform',`translate(${pt.x} ${pt.y}) rotate(${ang.toFixed(1)}) ${flip?'scale(1,-1)':''}`);wake.style.strokeDashoffset=String(L*(1-u));};
  return new Promise(res=>{
    if(FAST||REDUCED||skipVoyage||dur<=0){place(to);return res();}
    const t0=performance.now();
    const f=now=>{const t=skipVoyage?1:Math.min(1,(now-t0)/dur);const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;place(from+(to-from)*e);if(t<1)requestAnimationFrame(f);else res();};
    requestAnimationFrame(f);
  });
}

function stepModalFocus(direction){
  const ov=$('#modal'),items=[...ov.querySelectorAll('button,input,select,textarea,a[href],summary,[tabindex]')]
    .filter(el=>!el.disabled&&el.tabIndex>=0&&el.getClientRects().length);
  const i=items.indexOf(document.activeElement),n=items.length;
  const next=n?items[(i<0?(direction<0?n-1:0):(i+direction+n)%n)]:ov.firstElementChild;
  // Keyboard focus may enter numeric fields even on a touch-capable laptop.
  if(next)try{next.focus({preventScroll:true});}catch(e){}
}
function showModal(html,{cls='',onKey=null,dismiss=null,wide=false,keepFx=false}={}){

  ov.className='ov '+cls;ov.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  ov.hidden=false;modalKeys=onKey;modalDismiss=dismiss;
  $('#app').inert=true;$('#title').inert=true;ov.firstElementChild.tabIndex=-1;
  ov.onclick=e=>{if(e.target===ov&&modalDismiss)modalDismiss();};
  requestAnimationFrame(()=>{const f=ov.querySelector('[autofocus]')||ov.querySelector('.choice:not([disabled]),button:not([disabled]),input');if(f)softFocus(f,{preventScroll:true});});
  return ov.firstElementChild;

      go.textContent=q?`Sell ${q} for ${fmt(tot)}`:'Sell';go.className='btn lg amber';
    }
    go.disabled=q<=0;
  }
  function onKey(e){
    if(!stocked)return;
    if(e.target.closest&&e.target.closest('.trade-intel')&&(e.key==='Enter'||e.key===' '))return;
    if(e.target===qin&&/^[0-9]$/.test(e.key))return;
    const k=e.key;
    if(k==='ArrowRight'||k==='ArrowUp'){e.preventDefault();q+=e.shiftKey?10:1;update();sfx.tick();}
    else if(k==='ArrowLeft'||k==='ArrowDown'){e.preventDefault();q-=e.shiftKey?10:1;update();sfx.tick();}
    else if(k==='b'||k==='B'){setMode('buy');sfx.click();}
    else if(k==='s'||k==='S'){setMode('sell');sfx.click();}
    else if(k==='a'||k==='A'){q=1e9;update();}
    else if(k==='Enter'){e.preventDefault();if(!go.disabled)confirm();}
  }
  function confirm(){
    if(q<=0)return;
    const row=$(`.row[data-g="${gid}"]`);
    if(mode==='buy'){
      const b=coreBuy(gid,q);if(!b){sfx.error();return;}const n=b.q;
      closeModal();sfx.buy();log(`Bought ${n} ${g.name} for ${fmt(b.total)}${n>1?' ('+fmt(b.total/n)+' each)':''}.`);
      toast(`Loaded ${n} ${g.name} for ${fmt(b.total)}`,'info',gid,2200);
      renderAll();const r2=$(`.row[data-g="${gid}"]`);if(r2){r2.classList.add('flash');fly(r2,$('#st-hold'),Math.min(10,2+Math.ceil(n/5)),'box',g.c);}
      hint('firstbuy','The opening <b>harbor circular</b> shows every port. Compare the price age before sailing: quotes and dealers can change overnight. Later, visit ports or fit wireless for fresh quotes.');
    }else{
      const r=coreSell(gid,q);if(!r){sfx.error();return;}
      closeModal();sfx.sell();if(r.profit>0)sfx.profit();
      log(`Sold ${r.q} ${g.name} for ${fmt(r.total)} (${r.profit>=0?'profit':'loss'} ${fmt(Math.abs(r.profit))}).`,r.profit>=0?'good':'bad');
      renderAll();const r2=$(`.row[data-g="${gid}"]`);
      if(r2){r2.classList.add('flash');fly(r2,$('#st-cash'),Math.min(14,4+Math.ceil(r.total/3000)));floatText(r2,(r.profit>=0?'+':'−')+fmtK(Math.abs(r.profit)).replace('−',''),r.profit>=0?'#4ee39b':'#ff6274');
        if(r.profit>2000){const cc=center(r2);FX.burst(cc.x,cc.y,'#ffbe55',30);}}
    }
    save();
  }
  el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{setMode(b.dataset.mode);sfx.click();});
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{q+=+b.dataset.d;update();sfx.tick();});
  el.querySelector('[data-max]').onclick=()=>{q=1e9;update();sfx.tick();};
  qin.oninput=()=>{q=+qin.value||0;update(true);};
  // Updating summary/button markup during blur cancels the following tap in WebKit.
  qin.onblur=()=>{qin.value=q;};
  qin.onfocus=()=>{qin.value='';};
  qr.oninput=()=>{q=+qr.value;update();sfx.tick();};
  go.onclick=confirm;
  setMode(mode);
  setTimeout(()=>softFocus(go,{preventScroll:true}),40);
}
function chartSVG(hist,cost){
  const W=520,H=140,pad=30;const a=hist.slice(-14);const n=a.length;
  let mn=Math.min(...a),mx=Math.max(...a);if(cost){mn=Math.min(mn,cost);mx=Math.max(mx,cost);}
  const rg=(mx-mn)||mx*.1||1;mn-=rg*.08;mx+=rg*.08;
  const X=i=>pad+i*(W-pad-12)/(n-1||1),Y=v=>H-18-(v-mn)/(mx-mn)*(H-30);
  const line=a.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const firstDay=S.day-n+1;
  const lb=(x,y,t,cls='')=>`<span class="cl ${cls}" style="left:${(x/W*100).toFixed(1)}%;top:${(y/H*100).toFixed(1)}%">${t}</span>`;
  let grid='';for(let i=0;i<n;i++){const day=firstDay+i;if(i%3===(n-1)%3&&day>=1)grid+=lb(X(i),H-9,'N'+day,'cx');}
  grid+=lb(2,Y(mx-rg*.08),fmtK(mx-rg*.08).replace('¤',''),'cy')+lb(2,Y(mn+rg*.08),fmtK(mn+rg*.08).replace('¤',''),'cy');
  const col='#8fa6e8';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Price history">
    <defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" x2="${W-12}" y1="${Y(mx-rg*.08)}" y2="${Y(mx-rg*.08)}" stroke="rgba(255,255,255,.06)"/><line x1="${pad}" x2="${W-12}" y1="${Y(mn+rg*.08)}" y2="${Y(mn+rg*.08)}" stroke="rgba(255,255,255,.06)"/>
    <polygon points="${X(0)},${H-18} ${line} ${X(n-1)},${H-18}" fill="url(#cg)"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${cost?`<line x1="${pad}" x2="${W-12}" y1="${Y(cost)}" y2="${Y(cost)}" stroke="#ffbe55" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>`:''}
    <circle cx="${X(n-1)}" cy="${Y(a[n-1])}" r="5" fill="${col}" stroke="#0e1538" stroke-width="2"/>
    </svg>${grid}${cost?lb(W-14,Y(cost)-8,'your avg '+fmtK(cost),'ca'):''}`;
}
function gaugeHTML(g,p){
  const lo=Math.log(g.min),hi=Math.log(g.max);const t=clamp((Math.log(p)-lo)/(hi-lo),0,1);
  const v=vsUsual(g.id,p),word=Math.abs(v)<.05?'about usual':Math.abs(Math.round(v*100))+'% '+(v<0?'below':'above')+' usual';
  return `<div class="gauge"><div style="display:flex;justify-content:space-between"><span>Price today is <b style="color:var(--text)">${word}</b> for ${g.name}</span></div><div class="track"><div class="mk" style="left:${(t*100).toFixed(1)}%"></div></div><div class="ends"><span>${fmt(g.min)}</span><span>${fmt(g.max)}</span></div></div>`;
}
function elsewhereHTML(gid){
  const items=DISTRICTS.filter(d=>d.id!==S.loc).map(d=>{const sn=S.seen[d.id][gid];return{d,sn};});
  const vals=items.filter(x=>x.sn&&x.sn.st).map(x=>x.sn.p);const hi=Math.max(...vals),lo=Math.min(...vals);
  return items.map(({d,sn})=>{
    if(!sn)return `<div title="Not visited yet"><span>${d.name}</span><b style="color:var(--dim)">?</b></div>`;
    const ago=S.day-sn.day;const agoT=ago===0?'today':ago+'n ago';
    return `<div class="${sn.st&&sn.p===hi&&vals.length>1?'best':sn.st&&sn.p===lo&&vals.length>1?'low':''}" title="Seen ${agoT}"><span>${d.name} <small class="quote-age">${agoT}</small></span><b>${sn.st?fmtK(sn.p):'—'}</b></div>`;
  }).join('');
}

function askAmount({title,kicker,text,max,def,verb,cls='primary',note}){
  return new Promise(res=>{
    let v=clamp(def==null?max:def,0,max);let done=false;
    const fin=x=>{if(done)return;done=true;closeModal();res(x);};
    const el=showModal(`<div class="sheet"><div class="sh-head"><div><div class="kicker">${kicker||''}</div><h3 style="font-size:22px">${title}</h3><p>${text||''}</p></div><button class="btn icon ghost x" data-x aria-label="Close">${ico('close')}</button></div>
      <div class="qty"><input type="number" id="ain" min="0" max="${max}" inputmode="numeric" aria-label="Amount"></div>
      <input type="range" id="ar" min="0" max="${max}" step="1" aria-label="Amount slider">
      <div class="amt-presets"><button class="btn sm" data-f=".25">25%</button><button class="btn sm" data-f=".5">50%</button><button class="btn sm" data-f=".75">75%</button><button class="btn sm amber" data-f="1">All ${fmtK(max)}</button></div>
      <div class="summary" id="anote"></div>
      <div class="sh-foot"><button class="btn lg" data-x>Cancel</button><button class="btn lg ${cls}" id="ago">${verb}</button></div></div>`,
      {dismiss:()=>fin(null),onKey:e=>{if(e.key==='Enter'){e.preventDefault();if(v>0)fin(v);}}});
    const ain=$('#ain'),ar=$('#ar'),an=$('#anote'),go=$('#ago');
    const up=()=>{v=clamp(Math.round(v)||0,0,max);ain.value=v;ar.value=v;an.innerHTML=note?note(v):'';go.textContent=`${verb} ${fmt(v)}`;go.disabled=v<=0;};
    ain.oninput=()=>{v=+ain.value||0;up();};ar.oninput=()=>{v=+ar.value;up();};
    el.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{v=Math.floor(max*+b.dataset.f);up();sfx.tick();});
    el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>fin(null));
    go.onclick=()=>{if(v>0)fin(v);};
    up();setTimeout(()=>softFocus(go),40);
  });
}

function confirmBuy(title,cost,what){return choose({kicker:'Confirm',title,body:`${what} <b>${fmt(cost)}</b> leaves ${fmt(S.cash-cost)} in your purse.`,confirm:true,dismissKey:'no',choices:[{key:'yes',label:`Buy · ${fmt(cost)}`,cls:'primary'},{key:'no',label:'Not now'}]}).then(k=>k==='yes');}
async function serviceAction(a,btn){
  if(busy)return;
  const svcEl=$('#side-body');
  if(a==='repay'){
    const max=Math.min(S.cash,S.debt);
    const v=await askAmount({title:'Repay Marrow Quill',kicker:SVC.lender.name,text:`Every crown you repay tonight stops ${Math.round(debtRate()*100)}% nightly compounding against you.`,max,verb:'Repay',note:x=>`<span>Debt after</span><b>${fmt(S.debt-x)}</b><span>Purse after</span><b>${fmt(S.cash-x)}</b>`});
    if(!v)return;S.cash-=v;S.debt-=v;S.stats.repaid+=v;sfx.bank();
    log(`Repaid ${fmt(v)} to Marrow Quill.${S.debt===0?' The debt is cleared!':''}`,'good');
    if(S.debt===0){toast('Debt cleared. Marrow Quill looks almost disappointed.','gold','star',3600);sfx.win();FX.lanterns(18);}
    else toast(`Repaid ${fmt(v)}`,'good','quill');
  }else if(a==='borrow'){
    const max=Math.max(0,creditLimit()-S.debt);if(!max){toast('Marrow lends only against what you are worth. Earn more first.','bad','quill',3600);return;}
    const v=await askAmount({title:'Borrow from Marrow',kicker:SVC.lender.name,text:`"I lend against what a captain is worth, friend." You can owe up to ${fmt(creditLimit())}. ${Math.round(debtRate()*100)}% a night${S.day>DEBT_DEADLINE?'':`, and 10% after night ${DEBT_DEADLINE}`}.`,max,def:Math.min(max,2000),verb:'Borrow',cls:'danger',note:x=>`<span>Debt after</span><b>${fmt(S.debt+x)}</b><span>Interest tomorrow</span><b>${fmt((S.debt+x)*debtRate())}</b>`});
    if(!v)return;S.cash+=v;S.debt+=v;sfx.bank();log(`Borrowed ${fmt(v)} from Marrow Quill.`,'bad');toast(`Borrowed ${fmt(v)}`,'bad','quill');
  }else if(a==='deposit'){
    const v=await askAmount({title:'Deposit in the Vault',kicker:SVC.vault.name,text:'Safe from thieves, pirates and the sea. Earns 1.5% a night.',max:S.cash,verb:'Deposit',cls:'teal',note:x=>`<span>Vault after</span><b>${fmt(S.bank+x)}</b><span>Earns tomorrow</span><b>${fmt((S.bank+x)*VAULT_RATE)}</b>`});
    if(!v)return;S.cash-=v;S.bank+=v;sfx.bank();log(`Deposited ${fmt(v)} in the Lockwater Vault.`);toast(`Deposited ${fmt(v)}`,'good','safe');
  }else if(a==='withdraw'){
    const v=await askAmount({title:'Withdraw from the Vault',kicker:SVC.vault.name,text:'Cash on board can be stolen or lost.',max:S.bank,verb:'Withdraw',note:x=>`<span>Purse after</span><b>${fmt(S.cash+x)}</b>`});
    if(!v)return;S.cash+=v;S.bank-=v;sfx.bank();log(`Withdrew ${fmt(v)} from the vault.`);toast(`Withdrew ${fmt(v)}`,'info','safe');
  }else if(a==='hold'){
    const nt=HOLD_TIERS[S.holdTier+1];if(!nt||S.cash<nt.cost)return;
    if(!await confirmBuy('Bigger hold racks',nt.cost,`Hold ${capacity()} → ${capacity()+nt.cap-HOLD_TIERS[S.holdTier].cap}.`))return;
    S.cash-=nt.cost;S.holdTier++;sfx.upgrade();
    log(`Odile fitted new hold racks. Capacity now ${capacity()}.`,'gold');toast(`Hold expanded to ${capacity()}`,'gold','crate');burstAt($('#st-hold'));
  }else if(a==='motor'){
    const nm=MOTORS[S.motor+1];if(!nm||S.cash<nm.cost)return;
    if(!await confirmBuy(nm.name,nm.cost,'Faster getaways and fewer encounters.'))return;
    S.cash-=nm.cost;S.motor++;sfx.upgrade();
    log(`Installed a ${nm.name}.`,'gold');toast(`${nm.name} installed`,'gold','spark');
  }else if(a==='repair'||a==='patch'){
    const rate=a==='repair'?YARD_RATE:GUTTER_RATE,cap=a==='repair'?100:GUTTER_CAP;
    const pts=Math.min(cap-S.hull,Math.floor(S.cash/rate));if(pts<=0)return;
    S.cash-=Math.ceil(pts*rate);S.hull=Math.min(cap,S.hull+pts);sfx.upgrade();
    log(`Hull repaired to ${Math.round(S.hull)}% for ${fmt(Math.ceil(pts*rate))}.`,'good');toast(`Hull now ${Math.round(S.hull)}%`,'good','wrench');burstAt($('#st-hull'),'#4ee39b');
  }else if(a==='arms'){
    const na=ARMS[S.arms+1];if(!na)return;const cost=Math.round(na.cost*(+(btn&&btn.dataset.mk)||1));if(S.cash<cost)return;
    if(!await confirmBuy(na.name,cost,`Hit chance ${pct(ARMS[S.arms].p)} → ${pct(na.p)} per volley.`))return;
    S.cash-=cost;S.arms++;sfx.upgrade();
    log(`Bought a ${na.name}.`,'gold');toast(`${na.name} mounted on the bow`,'gold','arms');
  }else if(a==='wireless'){
    if(S.wireless||S.cash<WIRELESS_COST)return;
    if(!await confirmBuy('Wireless set',WIRELESS_COST,'Live prices and every bulletin, everywhere.'))return;
    S.cash-=WIRELESS_COST;S.wireless=true;sfx.upgrade();markSeen();S.effects.forEach(e=>{if(e.age===0)e.known=true;});

  }else if(a==='charter'){
    const cost=charterCost();if(S.charters[S.loc]||S.cash<cost)return;
    if(!await confirmBuy(`Trading charter: ${DI[S.loc].name}`,cost,'Dealers here trade twice as deep with you for the rest of the run.'))return;
    S.cash-=cost;S.charters[S.loc]=true;sfx.upgrade();
    log(`Bought a trading charter at ${DI[S.loc].name}. Its dealers now trade twice as deep with you.`,'gold');toast(`Charter: ${DI[S.loc].name} trades twice as deep`,'gold','star',3600);
  }else if(a==='rumor'){
    const cost=rumorCost();if(S.cash<cost||S.whisperDay===S.day||S.day>=NIGHTS)return;
    const e=leakPending();if(!e){toast('Ysolde has nothing worth selling tonight.','info','eye');renderAll();return;}
    S.cash-=cost;S.whisperDay=S.day;S.stats.whispers++;sfx.event();

    log(`Ysolde's whisper (${CONF[e.conf].short}): tomorrow at ${DI[e.d].name}, ${GI[e.g].name} ${e.type==='spike'?'will surge':'will crash'}.`,'info');
  }else return;
  renderAll();save();
}

// Reveal the surest rumour the market has already queued for tomorrow. Never creates one: returns null if none.

// ---------- event headers built from the portraits ----------
// ptAt drops a portrait (minus its halo) into a 520x150 scene: (x,y) is its top-left, s its scale.
// Busts are placed so portrait y=53 (where the shoulders meet the round crop) sits behind a foreground edge.
const ptAt=(k,x,y,s,o=1)=>`<g transform="translate(${x} ${y}) scale(${s})" opacity="${o}" fill="none" stroke-linecap="round" stroke-linejoin="round">${PORTRAIT[k].replace(/^<svg[^>]*><circle[^>]*>|<\/svg>$/g,'')}</g>`;
// repaint artBase's water band over a bust that stands in the canal
const ptSea=c=>`<rect y="112" width="520" height="38" fill="${c}"/><rect y="112" width="520" height="38" fill="rgba(5,10,30,.6)"/><path d="M0 116Q30 110 60 116T120 116 180 116 240 116 300 116 360 116 420 116 480 116 540 116" stroke="rgba(130,180,255,.25)" stroke-width="1.5" fill="none"/>`;
const ptGlow=(x,y,r,c,o=.35)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity="${o}"/>`;
const ptRefl=(xs,c)=>xs.map(x=>`<path d="M${x-10} 122h20M${x-6} 130h12M${x-3} 138h6" stroke="${c}" stroke-width="2" opacity=".35"/>`).join('');
const ptOrchid=(x,y,s,c='#ff8fd0')=>`<path d="${P.orchid}" transform="translate(${x-12*s} ${y-12*s}) scale(${s})" fill="${c}" opacity=".9"/>`;

function damage(n){const before=S.hull;S.hull=Math.max(0,S.hull-n);sfx.hit();shake();renderHUD();return Math.round(before-S.hull);}

async function encounter(kind){
  try{return await fightIt(kind);}finally{if(S&&S.trip){delete S.trip.boats;delete S.trip.boats0;}}

// Encounter tuning. The stakes follow what you carry (purse and cargo at usual prices), not just the purse,
// so keeping your money in cargo is no shield.
const ENC={
  flee:{base:.46,motor:.15,perBoat:.06,load:.16,min:.12,max:.9},
  fightPerBoat:.03,returnFire:.6,
  bribe:{perBoat:250,purse:.1,cargo:.07},
  toll:{min:200,purse:.18,cargo:.12},
  collect:{min:500,share:.35,credit:.75},   // Marrow's men keep a quarter of what they take
  runSeize:.12,                              // share of each cargo grabbed when a run fails
  loot:{gulls:[250,600],patrol:[300,800]},gullCargo:3500,collectFee:.1,
  calmNights:3,calmFactor:.5                 // after a victory, word spreads and fewer crews try you
};
const ENC_TXT={
  patrol:{title:'Tidewarden cutter!',kicker:'Searchlights on the water',
    intro:[n=>`${n===1?'A Tidewarden cutter swings':'A squadron of '+n+' Tidewarden cutters swing'} out of the dark, lamps blazing. "Heave to for inspection!"`,
      n=>`Searchlights snap on from under the viaduct: ${n===1?'a Tidewarden cutter':n+' Tidewarden cutters'}, rifles out. "Cargo papers, captain."`,
      n=>`A whistle shrieks across the water. ${n===1?'One cutter':n+' cutters'} of the Tidewarden watch close in from both banks.`],
    escape:'You kill the lantern, cut under a footbridge and drift through a drowned arcade. The searchlights sweep past and fade.',
    who:'a Tidewarden patrol',beaten:'the Tidewardens'},
  gulls:{title:'The Gull Gang!',kicker:'Ambush in the narrows',
    intro:[n=>`${n} skiffs with gull-feather pennants slide out from under a bridge. "Toll's due, friend. Pay up, or swim."`,
      n=>`Gull calls echo off the walls, and ${n} gang skiffs nose out of a flooded alley. "Nice cargo. Shame if it sank."`,
      n=>`A net drops across the canal ahead. ${n} Gull Gang skiffs wait behind it, oars up, grinning.`],
    escape:'You swing through a flooded market hall where their skiffs cannot follow. Their jeers fade behind you.',
    who:'the Gull Gang',beaten:'the Gull Gang'},
  collectors:{title:"Marrow's collectors",kicker:'Your debt has come to visit',
    intro:[n=>`Two black launches with heron lamps block the canal. "Marrow Quill wonders why his money is out here and not in his office."`,
      n=>`A heron lamp swings out of the fog. Marrow's collectors, ledgers open. "Payment, captain. Or something that floats."`],
    escape:'The heron lamps lose you in the fog. Marrow will hear about this.',
    who:"Marrow's collectors",beaten:"Marrow's collectors"}
};
const fleeChance=boats=>clamp(ENC.flee.base+ENC.flee.motor*S.motor-ENC.flee.perBoat*(boats-1)-ENC.flee.load*loadFrac(),ENC.flee.min,ENC.flee.max);
const fightChance=boats=>clamp(ARMS[S.arms].p-ENC.fightPerBoat*(boats-1),.08,.85);
const bribeCost=boats=>Math.round(ENC.bribe.perBoat*boats+ENC.bribe.purse*S.cash+ENC.bribe.cargo*cargoBaseValue());
const tollDue=()=>Math.max(ENC.toll.min,Math.round(ENC.toll.purse*S.cash+ENC.toll.cargo*cargoBaseValue()));
const collectDue=()=>Math.max(ENC.collect.min,Math.round(ENC.collect.share*Math.min(S.cash+cargoBaseValue(),S.debt)));
function fightIt(kind){return fightLoop(kind);}
async function fightLoop(kind){
  const cfg=ENC_TXT[kind];
  // the enemy count is saved with the voyage, so reloading mid-encounter resumes the same fight
  const T=S.trip&&typeof S.trip==='object'?S.trip:null;
  const resumed=!!(T&&isNum(T.boats)&&T.boats>0);
  let boats=resumed?Math.min(5,Math.round(T.boats)):kind==='patrol'?clamp((S.day<=5?rint(1,2):rint(1,3))+(S.day>18?1:0),1,4):kind==='gulls'?(S.day<=5?2:rint(2,4)):2;
  const start=T&&isNum(T.boats0)&&T.boats0>=boats?Math.min(5,Math.round(T.boats0)):boats;
  if(!resumed)S.stats.fights++;
  const intro=cfg.intro[(S.day+start)%cfg.intro.length](boats);
  let result=null;sfx.alarm();
  const art='enc_'+kind;
  while(true){
    ART[art]=ART[kind==='collectors'?'collectorsP':kind](boats);
    const fleeP=fleeChance(boats),fightP=fightChance(boats),bribe=bribeCost(boats),toll=tollDue(),collect=collectDue();
    const seize=kind==='collectors'?'':` and grab ${pct(ENC.runSeize)} of each cargo`;
    const choices=[
      {key:'run',label:'Run for it',sub:`${pct(fleeP)} each try to slip away${loadFrac()>.6?' (a heavy hold slows you)':''}. Each failed try rakes your hull${seize}.`,cls:'risk'},
      {key:'fight',label:`Fight · ${ARMS[S.arms].name}`,sub:`${pct(fightP)} per volley to sink a boat; ${pct(ENC.returnFire)} they hit back. Win and fewer crews try you for ${ENC.calmNights} nights.`,cls:'risk'}
    ];
    if(kind==='patrol'){choices.push({key:'bribe',label:`Bribe the sergeant · ${fmt(bribe)}`,sub:S.cash>=bribe?'Guaranteed. The price follows your purse and your cargo.':'Your purse is too light for this sergeant.',disabled:S.cash<bribe});
      choices.push({key:'yield',label:'Heave to and be searched',sub:'They seize half of every cargo and any sealed parcels.'});}
    else if(kind==='gulls')choices.push({key:'pay',label:`Pay the toll · ${fmt(toll)}`,sub:S.cash>=toll?'About a fifth of your purse plus a cut of your cargo.':shortSub(toll-S.cash)});
    else choices.push({key:'pay',label:`Hand over ${fmt(collect)}`,sub:`${pct(ENC.collect.credit)} of it comes off your debt; his men keep the rest.${S.cash<collect?' Your purse is short, so they take cargo too.':''}`});
    const extra=`<div class="enc-stats"><div>Your hull<b>${Math.round(S.hull)}%</b><div class="bar"><i style="width:${S.hull}%;background:${S.hull>60?'var(--up)':S.hull>30?'var(--amber)':'var(--down)'}"></i></div></div><div>Enemy boats<b>${boats}</b></div><div>Cargo at stake<b>${fmtK(cargoBaseValue())}</b></div></div>`;
    if(T){T.boats=boats;T.boats0=start;}save(); // each round is committed before the next choice
    const c=await choose({art,tone:'danger',kicker:cfg.kicker,title:cfg.title,body:result?'':intro,result,extra,choices});
    if(c==='run'){
      if(rnd()<fleeP){sfx.escape();S.stats.fled++;log(`Outran ${cfg.who}.`,'good');await info({art:'news',tone:'luck',kicker:'Escaped',title:'Lost them',body:cfg.escape});return;}
      const dmg=damage(rint(5,10)+boats*rint(2,4));
      if(S.hull<=0)return sunk('They ran you down and holed you below the waterline.');
      log(`Tried to outrun ${cfg.who} and was caught: hull −${dmg}%.`,'bad');
      let lostTxt='';if(kind!=='collectors'){const l=seizeShare(ENC.runSeize);if(l)lostTxt=` They grab <b>${l}</b>.`;}
      result={k:'bad',t:`They cut you off and rake your hull. <b>−${dmg}% hull.</b>${lostTxt}`};
    }else if(c==='fight'){
      sfx.shot();
      let msg='';
      if(rnd()<fightP){boats--;msg=`Direct hit! One boat drifts away, smoking. `;FX.burst(innerWidth/2,innerHeight*.3,'#ff8f3c',30);}
      else msg='Your shot goes wide. ';
      if(boats<=0){
        S.stats.won++;sfx.win();S.calmUntil=S.day+ENC.calmNights;
        let loot=0,goods='';
        if(kind==='collectors'){const fee=Math.round(S.debt*ENC.collectFee);S.debt+=fee;goods=`. Marrow will add ${fmt(fee)} to your debt for the trouble`;}
        else{const lr=ENC.loot[kind];loot=Math.round(rint(lr[0],lr[1])*start*(1+S.day/20));}
        if(kind==='gulls'){const free=capacity()-holdUsed();const g=pick(GOODS.slice(0,5));const n=Math.min(free,Math.max(1,Math.floor(ENC.gullCargo*(1+S.day/15)/g.base)));if(n>0){const c2=S.cargo[g.id];c2.cost=(c2.cost*c2.q)/(c2.q+n);c2.q+=n;goods=`, plus ${n} ${g.name} from their hold`;}}
        S.cash+=loot;
        log(`Fought off ${cfg.beaten} and took ${fmt(loot)}${goods}.`,'gold');
        await info({keepFx:true,art:'victory',tone:'luck',kicker:'Victory',title:'The canal is yours',body:`${msg}The last of them turns tail. ${loot?`You fish their strongbox out of the water: <b>${fmt(loot)}</b>${goods}.`:`They limp off empty-handed${goods}.`}`,extra:`<div class="result info">Word spreads. Fewer crews will try you for the next ${ENC.calmNights} nights.</div>`});
        renderAll();return;
      }
      if(rnd()<ENC.returnFire){const dmg=damage(rint(4,8)+boats*rint(2,4));if(S.hull<=0)return sunk('Their return fire tore your skiff apart.');msg+=`They return fire. <b>−${dmg}% hull.</b>`;}
      else msg+='Their return fire splashes harmlessly.';
      result={k:boats<start?'good':'bad',t:msg};
    }else if(c==='bribe'){
      S.cash-=bribe;S.stats.bribes++;S.stats.lost+=bribe;sfx.bank();
      log(`Bribed a Tidewarden sergeant ${fmt(bribe)}.`,'bad');
      await info({art:'news',kicker:'Bribe accepted',title:'Papers in order',body:`The sergeant pockets ${fmt(bribe)}, stamps nothing, and waves you on. "Mind the fog, citizen."`});return;
    }else if(c==='yield'){
      const lost=seizeShare(.5,true);
      const par=S.contracts.length;S.contracts=[];
      log(`Searched by Tidewardens. Seized: ${lost||'nothing'}${par?' and your sealed parcels':''}.`,'bad');
      await info({art:'news',tone:'danger',kicker:'Inspection',title:'Confiscated',body:lost?`They haul off ${lost}${par?', and the sealed parcels':''}. At least the skiff's still yours.`:'They find nothing worth taking and leave, disappointed.'});return;
    }else if(c==='pay'){
      const due=kind==='gulls'?toll:collect,amt=Math.min(due,S.cash);S.cash-=amt;S.stats.lost+=kind==='collectors'?Math.round(amt*(1-ENC.collect.credit)):amt;
      // a light purse is no way out: the shortfall comes out of the hold, or the hull
      let extraTxt='',inKind=0;
      if(amt<due){const sh=payInKind(due-amt);extraTxt=sh.txt;inKind=sh.value;if(S.hull<=0)return sunk('They smashed your skiff to kindling.');}
      if(kind==='collectors'){const credit=Math.round((amt+inKind)*ENC.collect.credit);S.debt=Math.max(0,S.debt-credit);log(`Marrow's collectors took ${fmt(amt)}${extraTxt?' and '+extraTxt:''}; ${fmt(credit)} came off your debt.`,'bad');}
      else log(`Paid the Gull Gang ${amt?fmt(amt):''}${amt&&extraTxt?' and ':''}${extraTxt}.`,'bad');
      sfx.bank();await info({art:'news',kicker:'Paid',title:kind==='gulls'?'Toll paid':'Payment collected',body:(kind==='gulls'?(amt?`They count your ${fmt(amt)} twice.`:'You turn out your empty pockets.'):`${fmt(amt)} goes into a ledger with your name on it, less the collectors' cut.`)+(extraTxt?` The rest is taken in kind: <b>${extraTxt}</b>.`:'')+(kind==='gulls'?' They melt back into the dark.':' "Marrow says the rest is due soon."')});return;
    }
  }
}
// take a share of every cargo (rounded up); returns a description, or '' if the hold was empty
function seizeShare(frac,yielded){
  const lost=[];
  // 'half of every cargo' rounds up; a run's share rounds fairly, so one Moon Ink is not 'twelve percent'
  GOODS.forEach(g=>{const cg=S.cargo[g.id];const n=Math.min(cg.q,yielded?Math.ceil(cg.q*frac):Math.floor(cg.q*frac+rnd()));if(n>0){S.stats.lost+=Math.round(n*cg.cost);cg.q-=n;if(!cg.q)cg.cost=0;lost.push(n+' '+g.name);}});
  return lost.join(', ');
}
// what an encounter takes when the purse can't cover it: cargo worth the shortfall (at usual prices), or hull
function shortSub(short){return cargoCount()?`Your purse is light, so they take about ${fmt(short)} of cargo too.`:'Nothing aboard worth taking. They will smash up the skiff (−12% hull).';}
function payInKind(short){
  if(cargoCount()>0){
    // whole units, cheapest first, until the shortfall (at usual prices) is covered
    const took={};let value=0;
    for(const g of GOODS){const cg=S.cargo[g.id];while(cg.q>0&&value<short){cg.q--;value+=g.base;S.stats.lost+=Math.round(cg.cost);took[g.id]=(took[g.id]||0)+1;}if(!cg.q)cg.cost=0;if(value>=short)break;}
    return{txt:Object.keys(took).map(k=>took[k]+' '+GI[k].name).join(', '),value};
  }
  const d=damage(12);return{txt:`${d}% of your hull`,value:0};
}
async function evSquall(){
  const canShelter=S.day<NIGHTS-1;
  const c=await choose({art:'squall',tone:'danger',kicker:'Weather',title:'A squall comes off the sea',body:'Black rain hammers the canal and the water starts to heave. Somewhere ahead, bridges are groaning.',
    choices:[{key:'push',label:'Push through',sub:`Arrive on time, but lose 6 to 16% hull (you have ${Math.round(S.hull)}%).`,cls:'risk'},{key:'shelter',label:'Shelter under the viaduct',sub:canShelter?'Safe, but you lose a whole night.':'No time left to wait.',disabled:!canShelter}]});
  if(c==='push'){const dmg=damage(rint(6,16));if(S.hull<=0)return sunk('The squall smashed you against a bridge pier.');log(`Pushed through a squall. Hull −${dmg}%.`,'bad');FX.rain(80);}
  else{advanceDay();log('Sheltered from a squall and lost a night.','bad');toast('You lost a night waiting out the storm','bad','bell');}
}
async function evCrate(){
  const g=pick(GOODS.slice(0,5));const n=rint(4,12),free=capacity()-holdUsed();
  const c=await choose({art:'crate',tone:'luck',kicker:'Flotsam',title:'A crate bobs past',body:`A sealed crate stencilled with <b>${g.name}</b> marks drifts alongside. Nobody seems to be looking for it. Yet.`,
    choices:[{key:'take',label:'Haul it aboard',sub:free>0?'4 in 5 crates are what they say. The rest are Gull Gang traps (−5 to −10% hull).':'No room: your hold is full.',disabled:free<=0},{key:'leave',label:'Leave it',sub:'Not worth the trouble.'}]});
  if(c!=='take')return;
  if(rnd()<.8){const k=Math.min(capacity()-holdUsed(),n);
    if(k<=0){await info({art:'crate',title:'No room',body:`It's ${n} ${g.name}, and your hold is full. You watch it drift away.`});return;}
    const cg=S.cargo[g.id];cg.cost=(cg.cost*cg.q)/(cg.q+k);cg.q+=k;sfx.sell();log(`Fished ${k} ${g.name} out of the canal.`,'gold');
    await info({art:'crate',tone:'luck',title:'Free cargo',body:`It's ${n} ${g.name}, dry and sealed.${k<n?` You have room for ${k}.`:''} Free money.`});}
  else{const dmg=damage(rint(5,10));if(S.hull<=0)return sunk('The crate was rigged to blow.');log(`A booby-trapped crate exploded. Hull −${dmg}%.`,'bad');
    await info({art:'crate',tone:'danger',title:'It was a trap',body:`The lid springs and something inside goes <i>bang</i>. The Gull Gang leave these out for fools. <b>−${dmg}% hull.</b>`});}
}
async function evGull(){
  const amt=Math.min(6000,Math.round(S.cash*.1));if(!amt)return;
