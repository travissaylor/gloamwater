// Marrow wants his money by night 10; after that, or once the debt runs past 12,000, his collectors hunt you
const debtHunted=()=>S.debt>0&&(S.debt>12000||S.day>10);
const ARRIVAL_EVENTS=[
  {id:'crate',w:()=>1,run:evCrate},
  {id:'gull',w:()=>S.cash>800?.9:0,run:evGull},
  {id:'racks',w:()=>!S.racks&&S.day>3?.6:0,run:evRacks},
  {id:'eel',w:()=>S.cash>400?.7:0,run:evFortune},
  {id:'leak',w:()=>cargoCount()>0?(S.hull<60?1.4:.45):0,run:evLeak},
  {id:'tip',w:()=>S.day<NIGHTS?.9:0,run:evTip},
  {id:'courier',w:()=>S.contracts.length<2&&S.day<NIGHTS-2?.8:0,run:evCourier},
  {id:'strongbox',w:()=>.5,run:evStrongbox},
  {id:'collectors',w:()=>debtHunted()&&S.loc!=='lq'?(S.day>10?2.2:1.6):0,run:()=>encounter('collectors')}
];
function encounterChance(dest){
  const calm=isNum(S.calmUntil)&&S.day<S.calmUntil?ENC.calmFactor:1;
  return clamp((.07+.035*DI[dest].danger+Math.min(.12,cargoBaseValue()/300000)-.04*S.motor+(S.day>20?.03:0))*calm,.03,.4);
}
function rollVoyageEvent(dest){
  if(S.stats.trips===0)return null;
  const pe=encounterChance(dest),r=rnd();
  if(r<pe){if(S.debt>0&&S.day>DEBT_DEADLINE&&rnd()<.35)return 'collectors';const pPatrol=dest==='fm'?.7:dest==='sl'?.3:.5;return rnd()<pPatrol?'patrol':'gulls';}
  if(r<pe+.06)return 'squall';
  return null;
}
function rollArrivalEvent(stayed){
  if(S.day>=NIGHTS&&rnd()<.5)return null;
  if(rnd()>(stayed?.32:.42))return null;
  const list=ARRIVAL_EVENTS.map(e=>({e,w:e.w()})).filter(x=>x.w>0);if(!list.length)return null;
  return weighted(list).e.id;
}
function runEvent(id){
  if(id==='patrol'||id==='gulls'||id==='collectors')return encounter(id);
  if(id==='squall')return evSquall();
  const e=ARRIVAL_EVENTS.find(x=>x.id===id);return e?e.run():Promise.resolve();
}

// =========================================================
//   TRAVEL  (each stage is saved, so a reload resumes mid-voyage
//            instead of letting the player dodge an encounter)
// =========================================================
// ---- canals: you sail only along a canal; a district without one is two nights, via a waypoint ----
const ADJ={};DISTRICTS.forEach(d=>ADJ[d.id]=new Set());EDGES.forEach(([a,b])=>{ADJ[a].add(b);ADJ[b].add(a);});
const adjacent=(a,b)=>!!ADJ[a]&&ADJ[a].has(b);
// the first leg towards `to`: direct along a canal, else via the safest district joined to both
function nextHop(from,to){if(adjacent(from,to))return to;const m=[...ADJ[from]].filter(x=>ADJ[x].has(to)).sort((x,y)=>DI[x].danger-DI[y].danger);return m[0]||to;}
const nightsTo=(from,to)=>from===to?0:adjacent(from,to)?1:2;
async function sailTo(did){
  if(busy||S.over||did===S.loc||!DI[did])return;
  if(S.day>=NIGHTS){toast('This is the final night. Settle up instead.','info','flag');return;}
  const hop=nextHop(S.loc,did);
  S.trip={from:S.loc,to:hop,stage:'out',ev:rollVoyageEvent(hop),next:hop!==did?did:null};
  save();
  await runTrip(false);
}
// spend a night at the mooring: the market moves, interest runs, and the night can still bring an event
async function stayNight(){
  if(busy||S.over)return;
  if(S.day>=NIGHTS){toast('This is the final night. Settle up instead.','info','flag');return;}
  S.trip={from:S.loc,to:S.loc,stage:'stay',ev:null,next:null};
  save();
  await runTrip(false);
}
// the night turns over at the destination (shared by voyages and staying put)
function nightFalls(T,stayed){
  advanceDay();
  S.loc=T.to;
  T.first=!stayed&&!S.visited[T.to];S.visited[T.to]=true;
  markSeen();revealNews();
  for(const c of S.contracts.filter(c=>c.to===T.to)){S.cash+=c.reward;log(`Delivered the sealed parcel. Paid ${fmt(c.reward)}.`,'gold');toast(`Parcel delivered: +${fmt(c.reward)}`,'gold','parcel');sfx.sell();}
  S.contracts=S.contracts.filter(c=>c.to!==T.to);
  log(stayed?`Stayed the night at ${DI[T.to].name}.`:`Arrived at ${DI[T.to].name}.`);
  const fresh=S.effects.filter(e=>e.known&&e.age===0);
  fresh.forEach(e=>log((e.d===T.to?'Here: ':'Bulletin: ')+e.text,e.type==='crash'?'good':e.type==='spike'?'info':'gold'));

async function runTrip(resumed){

  const w=$('#wake');if(w)w.style.opacity='0';
  renderAll();

function nightCard(note){

function save(){if(S&&!S.over)store.set(KEY_SAVE,S);}
// Saved data is untrusted (older versions, other tabs, hand edits): check every field before use.
const isNum=v=>typeof v==='number'&&isFinite(v);
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const STAT_KEYS=['trips','bought','sold','profit','bestFlip','fights','won','fled','bribes','events','interest','vaultEarned','peak','repaid','whispers','lost'];
function migrateSave(s){
  if(isObj(s)&&s.v===1){
    s.press={};DISTRICTS.forEach(d=>{s.press[d.id]={};GOODS.forEach(g=>s.press[d.id][g.id]=0);});
    if(Array.isArray(s.pending))s.pending.forEach(e=>{if(isObj(e)&&e.type!=='fest'){e.conf=e.conf||'likely';e.fate=e.fate||'full';}});
    s.whisperDay=0;s.v=SAVE_V;
  }
  return s;
}
function validEvent(e,aged){return isObj(e)&&['spike','crash','fest'].includes(e.type)&&!!DI[e.d]&&(e.type==='fest'?e.g==='*':!!GI[e.g])&&isNum(e.m)&&e.m>0&&isNum(e.days)&&typeof e.text==='string'&&(!aged||isNum(e.age))&&(e.type==='fest'||aged||(!!CONF[e.conf]&&['full','weak','turn'].includes(e.fate)));}
function validSave(s){
  try{
    if(!isObj(s)||s.v!==SAVE_V||s.over)return false;
    if(!['day','cash','bank','debt','hull','holdTier','motor','arms'].every(k=>isNum(s[k])))return false;
    if(!['day','holdTier','motor','arms'].every(k=>Number.isInteger(s[k])))return false;
    if(s.day<1||s.day>NIGHTS||s.cash<0||s.bank<0||s.debt<0||s.hull<=0||s.hull>100)return false;
    if(!DI[s.loc]||!HOLD_TIERS[s.holdTier]||!MOTORS[s.motor]||!ARMS[s.arms])return false;
    if(!GOODS.every(g=>isObj(s.cargo&&s.cargo[g.id])&&Number.isInteger(s.cargo[g.id].q)&&s.cargo[g.id].q>=0&&s.cargo[g.id].q<=1000&&isNum(s.cargo[g.id].cost)&&s.cargo[g.id].cost>=0&&isNum(s.trend&&s.trend[g.id])))return false;
    GOODS.forEach(g=>{const l=s.cargo[g.id].lot;if(l!=null&&!(isObj(l)&&DI[l.d]&&Number.isInteger(l.day)&&Number.isInteger(l.q)&&l.q>=0))delete s.cargo[g.id].lot;});
    if(!['cash','bank','debt'].every(k=>s[k]<=1e12))return false;
    for(const k of ['prices','press','local','stock','hist','seen'])if(!isObj(s[k])||!DISTRICTS.every(d=>isObj(s[k][d.id])))return false;
    for(const d of DISTRICTS)for(const g of GOODS){
      if(!isNum(s.prices[d.id][g.id])||s.prices[d.id][g.id]<=0||!isNum(s.press[d.id][g.id])||Math.abs(s.press[d.id][g.id])>1000||!isNum(s.local[d.id][g.id]))return false;
      if(typeof s.stock[d.id][g.id]!=='boolean')return false;
      const h=s.hist[d.id][g.id];if(!Array.isArray(h)||!h.length||!h.every(isNum))return false;
      const sn=s.seen[d.id][g.id];if(sn!=null&&!(isObj(sn)&&isNum(sn.p)&&isNum(sn.day)))return false;
    }
    if(!Array.isArray(s.effects)||!s.effects.every(e=>validEvent(e,true)))return false;
    if(!Array.isArray(s.pending)||!s.pending.every(e=>validEvent(e,false)))return false;
    if(!Array.isArray(s.contracts)||!s.contracts.every(c=>isObj(c)&&!!DI[c.to]&&Number.isInteger(c.due)&&isNum(c.reward)&&c.reward>=0&&c.reward<1e7&&Number.isInteger(c.size)&&c.size>0&&c.size<=10))return false;
    if(!Array.isArray(s.log)||!s.log.every(l=>isObj(l)&&typeof l.t==='string'))return false;
    if(!isObj(s.visited)||!isObj(s.hinted))return false;
    const used=GOODS.reduce((n,g)=>n+s.cargo[g.id].q,0)+s.contracts.reduce((n,c)=>n+c.size,0);
    if(used>HOLD_TIERS[s.holdTier].cap+(s.racks===true?15:0))return false;
    if(s.trip!=null&&!(isObj(s.trip)&&!!DI[s.trip.from]&&!!DI[s.trip.to]&&['out','mid','arrived','stay'].includes(s.trip.stage)&&(s.trip.ev==null||typeof s.trip.ev==='string')&&(s.trip.next==null||!!DI[s.trip.next])&&(s.trip.stage==='arrived'||s.day<NIGHTS)))return false;
    s.stats=isObj(s.stats)?s.stats:{};STAT_KEYS.forEach(k=>{if(!isNum(s.stats[k]))s.stats[k]=0;});
    if(typeof s.stats.bestFlipGood!=='string')s.stats.bestFlipGood='';
    s.name=typeof s.name==='string'?s.name.slice(0,18):'Captain';s.racks=s.racks===true;s.wireless=s.wireless===true;
    if(!isNum(s.whisperDay))s.whisperDay=0;
    if(!isNum(s.calmUntil))s.calmUntil=0;
    s.charters=isObj(s.charters)?Object.fromEntries(Object.keys(s.charters).filter(k=>DI[k]&&s.charters[k]===true).map(k=>[k,true])):{};
    ['rngM','rngE'].forEach(k=>{if(!Number.isInteger(s[k])||s[k]<0||s[k]>4294967295)s[k]=(Math.random()*4294967296)>>>0;});
    return true;
  }catch(e){return false;}
}
function loadSave(){const raw=store.get(KEY_SAVE,undefined),s=migrateSave(raw);if(validSave(s))return s;if(raw!==undefined||damagedKeys.has(KEY_SAVE)){damagedKeys.add(KEY_SAVE);store.del(KEY_SAVE);}return null;}
function loadScores(){
  const x=store.get(KEY_SCORES,[]);if(!Array.isArray(x))return[];
  return x.filter(e=>isObj(e)&&isNum(e.score)).map(e=>({name:String(e.name==null?'Captain':e.name).slice(0,18),score:Math.round(clamp(e.score,-1e12,1e12)),rank:typeof e.rank==='string'?e.rank:rankFor(e.score).name,night:isNum(e.night)?e.night:NIGHTS,sunk:e.sunk===true,date:typeof e.date==='string'?e.date.slice(0,10):'',id:String(e.id==null?Math.random():e.id)})).sort((a,b)=>b.score-a.score).slice(0,10);
}
function startGame(state,isNew){
  clearToasts();
  S=state;sel=null;selectedGood=null;busy=false;
  for(const k in shown)delete shown[k];
  $('#title').hidden=true;$('#app').inert=false;$('#app').setAttribute('aria-hidden','false');
  setView(isNarrow()?'market':'market');
  mapBuilt=false;
  requestAnimationFrame(()=>{buildMap();renderAll();});
  renderAll();
  if(isNew){log(`You owe Marrow Quill ${fmt(START_DEBT)} for the Little Lantern. Thirty nights to make it right.`,'bad');renderLog();}
  save();
  if(S.trip){busy=true;setTimeout(()=>{busy=false;runTrip(true);},400);}
}
function confirmSettle(){
  choose({art:'victory',tone:'gold',kicker:'Night '+S.day,title:'Settle up and end the run?',body:`${cargoCount()?`Cargo still aboard (${cargoCount()} units, worth ${fmt(cargoValueHere())} here) is dumped for <b>${fmt(Math.round(cargoValueHere()*.5))}</b>, half its sale value. `:'Your hold is empty. '} Your debt is subtracted from your cash and vault. ${S.debt>0&&S.loc!=='lq'?'<b>You still owe Marrow '+fmt(S.debt)+'.</b> It counts against you either way.':''}`,
    choices:[{key:'yes',label:'Settle up',cls:'primary'},{key:'no',label:'Not yet'}],dismissKey:'no'}).then(c=>{if(c==='yes')endGame('complete');});
}
function tally(reason){
  const sunk=reason==='sunk';
  const cargo=sunk?0:Math.round(cargoValueHere()*.5);
  const cash=sunk?0:S.cash;
  const net=cash+S.bank+cargo-S.debt;
  return{cash,bank:S.bank,cargo,debt:S.debt,net,sunk};
}
// ends the run and writes the ledger once; safe to call before any card is shown
function recordRun(reason){
  S.over=true;busy=false;store.del(KEY_SAVE);
  const t=tally(reason),rank=rankFor(t.net);
  const entry={name:S.name||'Captain',score:t.net,rank:rank.name,night:S.day,sunk:t.sunk,date:new Date().toISOString().slice(0,10),id:Math.random().toString(36).slice(2)};
  const scores=loadScores();scores.push(entry);scores.sort((a,b)=>b.score-a.score);const top=scores.slice(0,10);store.set(KEY_SCORES,top);
  return{t,rank,entry,top,placed:top.findIndex(x=>x.id===entry.id)};
}
async function endGame(reason,rec){
  if(S.over&&!rec)return;
  const {t,rank,entry,top,placed}=rec||recordRun(reason);clearToasts();document.body.classList.add('fx-under');
  if(t.net>0&&!t.sunk){sfx.win();setTimeout(()=>FX.lanterns(50),300);}else{sfx.lose();FX.rain(100);}
  const html=`<div class="end-hero">
      <div class="kicker">${t.sunk?'Sunk on night '+S.day:S.day<NIGHTS?'Settled on night '+S.day:'Thirty nights, done'}</div>
      ${emblemSVG(rank)}
      <h3 style="color:${rank.color}">${rank.name}</h3>
      <p class="rankline">${t.sunk?'Your skiff and cargo are gone. The ledger records what remains.':rank.line}</p></div>
    <div class="breakdown">
      <span>Cash on board</span><b>${t.sunk?'lost':fmt(t.cash)}</b>
      <span>Lockwater Vault</span><b>${fmt(t.bank)}</b>
      <span>Cargo dumped at half price</span><b>${t.sunk?'lost':fmt(t.cargo)}</b>
      <span>Owed to Marrow Quill</span><b style="color:#ffb3bc">${t.debt?'−'+fmt(t.debt):'paid off'}</b>
      <span class="tot">Final fortune</span><b class="tot" id="final-n">${fmt(0)}</b>
    </div>
    <div class="statgrid">
      <div>Voyages<b>${S.stats.trips}</b></div><div>Best single profit<b>${S.stats.bestFlip?fmtK(S.stats.bestFlip):'—'}</b></div><div>Peak worth<b>${fmtK(S.stats.peak)}</b></div>
      <div>Encounters<b>${S.stats.fights}</b><small>won ${S.stats.won} · fled ${S.stats.fled}</small></div><div>Interest accrued<b>${fmtK(S.stats.interest)}</b></div><div>Lost to thieves, tolls, leaks<b>${fmtK(S.stats.lost)}</b></div>
    </div>
    ${nextRankHTML(t.net)}
    <div class="card-body"><div class="kicker" style="margin-bottom:6px">Captains' Ledger${placed>=0?` · you placed #${placed+1}`:''}</div>${ledgerTable(top,entry.id)}
    <div class="choices end-act" style="grid-template-columns:1fr 1fr"><button class="choice primary" data-choice="again"><kbd>1</kbd><div>Sail again</div></button><button class="choice" data-choice="title"><kbd>2</kbd><div>Title screen</div></button></div></div>`;
  const el=showModal(html,{keepFx:true,cls:'tone-'+(t.net>0&&!t.sunk?'gold':'danger'),wide:true,onKey:e=>{if(e.key==='1')again();if(e.key==='2')toTitle();}});
  const again=()=>{closeModal();openIntro();};const toTitle=()=>{closeModal();showTitle();};
  el.querySelector('[data-choice=again]').onclick=again;el.querySelector('[data-choice=title]').onclick=toTitle;
  const fn=$('#final-n');const t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/1400),e=1-Math.pow(1-k,3);fn.textContent=fmt(t.net*e);if(k<1)requestAnimationFrame(step);};
  if(FAST||REDUCED)fn.textContent=fmt(t.net);else requestAnimationFrame(step);
}
function nextRankHTML(v){
  const i=RANKS.findIndex(r=>r.min>v);if(i<0)return '<p class="nextrank">The top of the ledger. Nobody on the canals is richer.</p>';
  return `<p class="nextrank">${fmt(RANKS[i].min-v)} short of <b style="color:${RANKS[i].color}">${RANKS[i].name}</b>.</p>`;
}
function emblemSVG(r){
  return `<svg class="emblem" viewBox="0 0 120 120"><defs><radialGradient id="eg"><stop offset="0" stop-color="${r.color}" stop-opacity=".5"/><stop offset="1" stop-color="${r.color}" stop-opacity="0"/></radialGradient></defs>
  <circle cx="60" cy="60" r="58" fill="url(#eg)"/><circle cx="60" cy="60" r="40" fill="#0e1538" stroke="${r.color}" stroke-width="3"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="${r.color}" stroke-width="1" stroke-dasharray="3 5"/>
  <g transform="translate(36 36) scale(2)" fill="none" stroke="${r.color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${P.lantern}"/></g></svg>`;
}
function ledgerTable(list,hl){
  if(!list.length)return '<p style="color:var(--muted);font-size:15px">No runs recorded yet. The ledger is waiting for your name.</p>';
  return `<table class="ledger"><thead><tr><th>#</th><th>Captain</th><th>Rank</th><th style="text-align:right">Fortune</th></tr></thead><tbody>`+
    list.map((x,i)=>`<tr class="${x.id===hl?'me':''}"><td>${i+1}</td><td>${esc(x.name)}${x.sunk?' <span class="rk">(sunk)</span>':''}<div class="rk">${esc(x.date||'')}</div></td><td class="rk">${esc(x.rank)}</td><td class="n">${fmt(x.score)}</td></tr>`).join('')+'</tbody></table>';
}

// ---------- title / intro / help / menu ----------
function showTitle(){
  clearToasts();
  S=null;closeModal();
  const t=$('#title');t.hidden=false;$('#app').inert=true;$('#app').setAttribute('aria-hidden','true');
  const has=!!loadSave(),damaged=damagedKeys.delete(KEY_SAVE);
  t.innerHTML=`${titleScene()}<div class="tt-inner">
    <h1>GLOAMWATER</h1>
    <div class="sub">Thirty nights. One skiff. A drowned city full of things worth smuggling.</div>
    ${damaged?'<p role="status" style="font-size:15px;color:#ffe2b0;max-width:340px;margin:12px auto">Your saved voyage could not be loaded. Start a new run.</p>':''}
    <div class="tt-btns">
      ${has?`<button class="btn primary lg" id="t-cont">Continue voyage</button>`:''}
      <button class="btn ${has?'':'primary'} lg" id="t-new">${has?'New run':'Cast off'}</button>
      <div class="tt-row"><button class="btn" id="t-help">How to play</button><button class="btn" id="t-ledger">Captains' Ledger</button><button class="btn icon" id="t-mute" aria-label="Toggle sound">${ico(Sound.muted?'mute':'sound')}</button></div>
    </div></div>
    <div class="tt-foot">Touch, mouse or keyboard · Sound is synthesized live</div>`;
  for(let i=0;i<16;i++){const l=document.createElement('div');l.className='lantern-p';l.style.left=(vrnd()*100)+'%';l.style.animationDuration=(14+vrnd()*16)+'s';l.style.animationDelay=(-vrnd()*25)+'s';l.style.transform=`scale(${.6+vrnd()*.8})`;t.appendChild(l);}
  const c=$('#t-cont');if(c)c.onclick=()=>{sfx.click();const s=loadSave();if(!s){showTitle();return;}
    try{startGame(s,false);}catch(err){console.warn(err);store.del(KEY_SAVE);showTitle();toast('That saved voyage was damaged and could not be loaded. Start a new run.','bad','bell',5000);}};
  $('#t-new').onclick=()=>{sfx.click();openIntro();};
  $('#t-help').onclick=()=>{sfx.click();openHelp();};
  $('#t-ledger').onclick=()=>{sfx.click();showModal(`<div class="card-body"><div class="kicker">Hall of fortunes</div><h3>Captains' Ledger</h3>${ledgerTable(loadScores(),null)}<div class="choices"><button class="choice primary" data-x><kbd>1</kbd><div>Close</div></button></div></div>`,{dismiss:closeModal,onKey:e=>{if(e.key==='1')closeModal();}}).querySelector('[data-x]').onclick=closeModal;};
  $('#t-mute').onclick=()=>{toggleMute();$('#t-mute').innerHTML=ico(Sound.muted?'mute':'sound');};
  setTimeout(()=>{const b=$('#t-cont')||$('#t-new');if(b)softFocus(b,{preventScroll:true});},50);
}
function titleScene(){
  const R=seeded(7);let city='',wins='';
  let x=0;while(x<1600){const w=30+R()*70,h=60+R()*220;const y=600-h;city+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${R()<.5?'#0d1230':'#121838'}"/>`;
    if(R()<.3)city+=`<path d="M${(x+w/2).toFixed(0)} ${(y-30-R()*40).toFixed(0)} L${(x+w*.3).toFixed(0)} ${y.toFixed(0)} L${(x+w*.7).toFixed(0)} ${y.toFixed(0)} Z" fill="#0d1230"/>`;
    for(let yy=y+10;yy<590;yy+=14)for(let xx=x+6;xx<x+w-8;xx+=11)if(R()<.18)wins+=`<rect class="${R()<.2?'win':''}" style="animation-delay:${(R()*5).toFixed(1)}s" x="${xx.toFixed(0)}" y="${yy.toFixed(0)}" width="4" height="6" fill="${R()<.85?'#ffc56b':'#7ef0ff'}"/>`;
    x+=w+R()*6;}
  return `<svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>
    <radialGradient id="tm"><stop offset="0" stop-color="#fff5dc"/><stop offset=".6" stop-color="#ffd28a"/><stop offset="1" stop-color="#ffb347"/></radialGradient>
    <radialGradient id="tmg"><stop offset="0" stop-color="rgba(255,200,120,.35)"/><stop offset="1" stop-color="rgba(255,200,120,0)"/></radialGradient>
    <linearGradient id="tw" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#101848"/><stop offset="1" stop-color="#03050f"/></linearGradient>
    <filter id="wob"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.06" numOctaves="2" seed="3">${REDUCED?'':'<animate attributeName="baseFrequency" dur="9s" values="0.004 0.06;0.005 0.08;0.004 0.06" repeatCount="indefinite"/>'}</feTurbulence><feDisplacementMap in="SourceGraphic" scale="18"/></filter>
    <g id="city">${city}${wins}</g></defs>
    <circle cx="1180" cy="210" r="260" fill="url(#tmg)"/><circle cx="1180" cy="210" r="70" fill="url(#tm)"/>
    <use href="#city"/>
    <rect y="600" width="1600" height="300" fill="url(#tw)"/>
    <g filter="url(#wob)" opacity=".38"><use href="#city" transform="translate(0 1200) scale(1 -1)"/><ellipse cx="1180" cy="760" rx="40" ry="110" fill="#ffd28a" opacity=".5"/></g>
    <rect y="598" width="1600" height="3" fill="rgba(255,200,120,.25)"/>
  </svg>`;
}
function openIntro(){
  const nm=settings.name||'';
  const el=showModal(`<div class="art">${ART.tip()}</div><div class="card-body">
    <div class="kicker">A new voyage</div><h3>Thirty nights in Gloamwater</h3>
    <p>The sea took the lower city forty years ago. Now its canals run on lantern-light and quiet deals. You own a battered skiff, the <i>Little Lantern</i>, and you owe <b>Marrow Quill ${fmt(START_DEBT)}</b> for it. His interest compounds at <b>6% every night</b>, and he wants it back by <b>night 10</b>.</p>
    <p>You have <b>${fmt(START_CASH)}</b> and thirty nights. Buy cheap in one district, sell dear in another, and be the richest captain on the water when the last lantern goes out.</p>
    <label class="kicker" for="cap-name">Your name, captain</label>
    <input class="namein" id="cap-name" maxlength="18" placeholder="Captain" value="${esc(nm)}" autocomplete="off">
    <div class="choices"><button class="choice primary" id="go"><kbd>⏎</kbd><div>Cast off<small>${settings.tutorial?'':'A quick guided tour starts first. You can skip it.'}</small></div></button></div></div>`,
    {dismiss:()=>{closeModal();if(!S)showTitle();},onKey:e=>{if(e.key==='Enter'){e.preventDefault();go();}}});
  const go=()=>{const n=($('#cap-name').value||'').trim().slice(0,18)||'Captain';settings.name=n;saveSettings();closeModal();Sound.unlock();sfx.arrive();
    startGame(newState(n),true);if(!settings.tutorial)setTimeout(startCoach,500);};
  el.querySelector('#go').onclick=go;
  setTimeout(()=>{const i=$('#cap-name');if(i&&!isNarrow())softFocus(i);},60);
}
function openHelp(){
  const html=`<div class="card-body help"><div style="display:flex;align-items:flex-start"><div><div class="kicker">Captain's handbook</div><h3>How to play</h3></div><button class="btn icon ghost" data-x style="margin-left:auto" aria-label="Close">${ico('close')}</button></div>
  <h4>${ico('flag')}The goal</h4><p>End night 30 with the largest fortune: cash + vault + half-price cargo − debt. Your rank and the Captains' Ledger are waiting.</p>
  <h4>${ico('coin')}Trading</h4><ul><li>Each district has its own prices, and they shift every night. The small line on each good shows its recent history here; tap a good for the full chart.</li><li>The <b>%</b> beside each price compares it with that good's usual price across the city. <b style="color:#4ee39b">Green</b> is below usual, <b style="color:#ffbe55">amber</b> is above usual. Compare the actual buy and sale quotes before choosing a route.</li><li>The opening <b>harbor circular</b> records all seven ports on night 1. After that, remote quotes age until you visit or fit the wireless set. <b>Saint Mire +40% seen 1n ago</b> is an observation, not a promised sale: prices and dealers can change before arrival.</li><li>The default buy quantity keeps <b>15% of your purse</b> for repairs and tolls when possible. If one unit alone uses the reserve, the default is one. <b>Max</b> deliberately uses the full cash/hold limit; its quote includes price impact.</li><li><b>Big orders move prices.</b> Dealers trade a few units at the posted price, then each extra unit costs more (or fetches less). The market takes a night or two to recover. Spread big money across several goods and ports.</li><li>District supply and import habits give context. Check the dated prices in Port details before sailing.</li></ul>
  <h4>${ico('map')}Voyages</h4><ul><li>Sailing along a canal costs <b>one night</b>; a district with no direct canal is two nights, via a waypoint. Lanternquay joins every district. You can also <b>stay the night</b> where you are (tap your own district on the map). The danger pips show how often patrols and gangs prowl.</li><li>The trade screen remembers your observed prices. Green <b>+%</b> map badges compare tonight’s observed price with your cargo cost; a future quote can differ.</li></ul>
  <h4>${ico('quill')}Debt and the vault</h4><ul><li>Marrow charges 6% a night until night 10, then 10%. Repay at Lanternquay before his collectors find you.</li><li>The Lockwater Vault (Lanternquay, Drowned Exchange) pays 1.5% a night and keeps cash safe.</li></ul>
  <h4>${ico('wrench')}Upgrades</h4><ul><li>Copperhook Docks: bigger hold, faster engine, repairs. Saint Mire & Fogmouth: weapons. Drowned Exchange: a wireless set for live prices everywhere. Orchid Terraces: Madame Ysolde sells one rumour a night about tomorrow's shocks. Rumours can land weak or turn the other way; she tells you how sure she is.</li></ul>
  <h4>${ico('skull')}Danger</h4><ul><li>Patrols, the Gull Gang and Marrow's collectors may stop you. Run, fight, bribe or pay. If your hull hits 0%, you sink and lose your cash and cargo.</li></ul>
  <h4>${ico('sound')}Sound</h4><p>Every sound is synthesized live. Toggle it under More (or press M). No sound on an iPhone? Check the ring/silent switch.</p>
  <h4 class="kb-only">${ico('star')}Controls</h4><div class="keys"><kbd>1</kbd>–<kbd>7</kbd><span>Pick a district · <kbd>Enter</kbd> to sail</span><kbd>↑</kbd><kbd>↓</kbd><span>Pick a good · <kbd>B</kbd> buy · <kbd>S</kbd> sell</span><kbd>←</kbd><kbd>→</kbd><span>Adjust quantity (<kbd>Shift</kbd> ×10) · <kbd>A</kbd> max</span><kbd>1</kbd>–<kbd>4</kbd><span>Choose options in events</span><kbd>M</kbd><span>Mute · <kbd>?</kbd> this help · <kbd>Esc</kbd> close / menu</span></div>
  <div class="choices">${S?'<button class="choice" data-tour><kbd>2</kbd><div>Replay the guided tour</div></button>':''}<button class="choice primary" data-x><kbd>1</kbd><div>Got it</div></button></div></div>`;
  const el=showModal(html,{dismiss:closeModal,onKey:e=>{if(e.key==='1')closeModal();if(e.key==='2'&&S){closeModal();startCoach();}}});
  el.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);const tb=el.querySelector('[data-tour]');if(tb)tb.onclick=()=>{closeModal();startCoach();};
}
const STAT_HELP={
  'st-cash':['Purse','Cash on board. Thieves, tolls and gulls take from it, and it sinks with the skiff. Keep big money in the vault.'],
  'st-bank':['Lockwater Vault','Safe from thieves and the sea, and earns 1.5% a night. Branches at Lanternquay and the Drowned Exchange.'],
  'st-debt':['Debt to Marrow Quill','Grows 6% a night, and 10% after his night-10 deadline. Repay at Lanternquay. Still owing after night 10, or owing more than ¤12,000, sends his collectors after you on the canals. He lends only up to what you are worth.'],
  'st-hold':['Hold','Cargo space used and total. Odile at Copperhook Docks sells bigger racks.'],
  'st-hull':['Hull','At 0% the skiff sinks and you lose your purse and cargo. Below 60% it leaks. Repairs at Copperhook Docks; cheap patches at the Sluices.']
};
function explainStat(id){const h=STAT_HELP[id];if(!h||!S||!$('#modal').hidden)return;info({kicker:'Your ledger',title:h[0],body:h[1],ok:'Got it'});}
function openMenu(){
  if(!S)return;if(busy){toast('Hold on, you are under way.','info','bell',1800);return;}
  choose({kicker:'Paused',title:'Ship\'s menu',body:`Night ${S.day} of ${NIGHTS} · ${esc(S.name)}`,dismissKey:'resume',
    choices:[{key:'resume',label:'Resume',cls:'primary'},{key:'help',label:'How to play',sub:'Rules, price colours, and a replay of the guided tour.'},{key:'sound',label:Sound.muted?'Turn sound on':'Turn sound off'},{key:'ambient',label:settings.ambient===false?'Turn ambience on':'Turn ambience off',sub:'The hush of the canals and a distant bell.'},{key:'quit',label:'Save and return to title',sub:'Your voyage is saved automatically.'},{key:'abandon',label:'Abandon this run',sub:'Ends the game now and records your score.',cls:'risk'}]}).then(c=>{
    if(c==='help')openHelp();else if(c==='sound')toggleMute();else if(c==='ambient'){settings.ambient=settings.ambient===false;saveSettings();if(settings.ambient)Sound.ambientOn();else Sound.ambientOff();toast(settings.ambient?'Ambience on':'Ambience off','info','sound');}else if(c==='quit'){save();showTitle();}
    else if(c==='abandon')choose({tone:'danger',title:'Abandon the run?',body:'This settles up right now, as if it were the final night.',choices:[{key:'yes',label:'Yes, settle now',cls:'risk'},{key:'no',label:'Keep sailing',cls:'primary'}],dismissKey:'no'}).then(k=>{if(k==='yes')endGame('complete');});
  });
}

// ---------- guided tour ----------
let coachOpen=false,coachI=0;
const COACH=[
  {sel:'#hud-stats',view:'market',title:'Your ledger',text:'Cash in your <b>purse</b>, savings in the <b>vault</b>, and your <b>debt</b> to Marrow Quill, which grows 6% every night and must be repaid by night 10. Watch your <b>hold</b> space and <b>hull</b> too.'},
  {sel:'#side-body .rows',view:'market',title:'Your first trade',text:'The <b>harbor circular</b> lists all seven ports tonight. Row notes name a higher observed sale price and its age. Tap a good to compare quotes. Prices and dealers can change on arrival; later quotes need a visit or wireless.'},
  {sel:'#mapwrap',view:'map',title:'The canals',text:'Tap a district, then <b>Port details</b> for dated prices. A lit canal takes <b>one night</b>; other ports need two via a waypoint. Compare the route and risk before tapping Sail.'},
  {sel:'#panel-side',view:'harbor',title:'Harbor services',text:'Repay Marrow and use the vault at Lanternquay. Upgrade your hold and engine at Copperhook Docks. The <b>directory</b> lists every service.'},
  {sel:'#h-night',view:'market',title:'Thirty nights',text:'On night 30, sell everything and settle up. Good luck, captain. Help is under <b>More</b><span class="kb-only"> (or press <kbd>?</kbd>)</span>.'}
];
function startCoach(){coachOpen=true;coachI=0;let c=$('#coach');if(!c){c=document.createElement('div');c.id='coach';document.body.appendChild(c);}c.innerHTML='<div class="spot"></div><div class="tip"></div>';c.hidden=false;showCoach();}
function showCoach(){
  const st=COACH[coachI];setView(st.view);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const t=$(st.sel);const c=$('#coach');if(!t||!c)return;const r=t.getBoundingClientRect();
    const sp=c.querySelector('.spot');const pad=6;sp.style.left=(r.left-pad)+'px';sp.style.top=(r.top-pad)+'px';sp.style.width=(r.width+pad*2)+'px';sp.style.height=(Math.min(r.height,innerHeight-r.top-10)+pad*2)+'px';
    const tip=c.querySelector('.tip');
    tip.innerHTML=`<div class="steps">${coachI+1} / ${COACH.length}</div><h3>${st.title}</h3><p>${st.text}</p><div class="row2"><button class="btn ghost sm" data-skip>Skip tour</button><button class="btn primary" data-next>${coachI===COACH.length-1?'Start trading':'Next'} <kbd>⏎</kbd></button></div>`;
    tip.style.animation='none';void tip.offsetWidth;tip.style.animation='';
    const tw=Math.min(340,innerWidth-24);let left=clamp(r.left+r.width/2-tw/2,12,innerWidth-tw-12);let top=r.bottom+14;
    const th=tip.offsetHeight||190;
    if(top+th>innerHeight-12){top=r.top-th-14;}
    if(top<12){top=clamp(r.top+24,12,innerHeight-th-12);left=clamp(r.left+24,12,innerWidth-tw-12);}
    tip.style.left=left+'px';tip.style.top=top+'px';
    tip.querySelector('[data-next]').onclick=()=>coachNext(false);tip.querySelector('[data-skip]').onclick=()=>coachNext(true);
    softFocus(tip.querySelector('[data-next]'),{preventScroll:true});
  }));
}
function coachNext(skip){sfx.click();coachI++;if(skip||coachI>=COACH.length){coachOpen=false;const c=$('#coach');if(c)c.remove();settings.tutorial=true;saveSettings();setView('market');return;}showCoach();}

// ---------- boot ----------
updateMuteBtn();
showTitle();
</script>
